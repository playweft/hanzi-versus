<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f5ef" />
  <title>汉字对决</title>
  <link rel="stylesheet" href="./src/styles/main.css" />
</head>

<body>
  <section id="start-screen" class="start-screen" aria-labelledby="start-title">
    <img class="start-icon" src="./icon.svg" alt="" width="96" height="96" />
    <p class="eyebrow">HANZI VERSUS</p>
    <h1 id="start-title">汉字对决</h1>
    <p class="start-description">一字一句，皆有妙趣。请选择一种玩法。</p>
    <div class="mode-options" role="group" aria-label="选择玩法">
      <button type="button" data-play-mode="idiom" disabled>
        <span class="scroll-rod" aria-hidden="true"></span>
        <span class="scroll-paper"><strong>成语寻踪</strong></span>
        <span class="scroll-rod" aria-hidden="true"></span>
      </button>
      <button type="button" data-play-mode="poetry" disabled>
        <span class="scroll-rod" aria-hidden="true"></span>
        <span class="scroll-paper"><strong>拾字成诗</strong></span>
        <span class="scroll-rod" aria-hidden="true"></span>
      </button>
    </div>
    <p id="start-status" class="start-status" aria-live="polite">正在连接…</p>
  </section>

  <main id="game" class="game-shell" hidden>
    <header class="game-header">
      <button class="back-button" type="button" aria-label="返回首页" title="返回首页" onclick="location.reload()">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
      </button>
      <h1>成语寻踪</h1>
    </header>
    <div class="game-content">
        <div class="game-meta" aria-label="游戏进度">
          <span id="mode-label">单人模式</span>
          <span class="meta-divider" aria-hidden="true"></span>
          <span id="round-label">第 1 / 6 轮</span>
          <span id="timer" class="timer">--:--</span>
        </div>

      <p id="status" class="status" aria-live="polite">准备开始…</p>
      <button id="retry-hint" class="quiet-button" type="button" hidden>重新生成提示</button>

      <section class="content-card hint-card" aria-labelledby="hint-title">
        <div class="card-heading">
          <span class="heading-icon hint-icon" aria-hidden="true">💡</span>
          <div>
            <h2 id="hint-title">提示词语</h2>
            <p>这些词语与成语有关：</p>
          </div>
        </div>
        <div id="history" class="hint-grid" aria-live="polite">
          <span id="hint" class="hint-tile current" aria-label="当前 AI 提示">？</span>
        </div>

        <form id="guess-form" class="guess-form">
          <label class="sr-only" for="guess">输入四字成语</label>
          <div class="guess-row">
            <input id="guess" inputmode="text" autocomplete="off" maxlength="4" placeholder="请输入你的猜测..."
              aria-label="请输入你的猜测" />
            <button id="submit" type="submit">提交</button>
          </div>
        </form>
      </section>

      <section class="content-card wrong-card" aria-labelledby="wrong-title">
        <div class="card-heading">
          <span class="heading-icon wrong-icon" aria-hidden="true">×</span>
          <div>
            <h2 id="wrong-title">错误猜测</h2>
            <p>你之前猜过的成语：</p>
          </div>
        </div>
        <div id="wrong-guesses" class="wrong-list" aria-live="polite">
          <span class="empty-state">还没有错误猜测</span>
        </div>
      </section>

      <section id="notice" class="notice" hidden></section>
      <button id="next" class="next" type="button" hidden>下一题</button>

      <footer>先答错会给对手留下 0.8 秒竞答窗口</footer>
    </div>
  </main>

  <main id="poetry-game" class="game-shell" hidden>
    <header class="game-header">
      <button class="back-button" type="button" aria-label="返回首页" title="返回首页" onclick="location.reload()">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
      </button>
      <h1>拾字成诗</h1>
    </header>
    <div class="game-content">
      <div class="poetry-toolbar">
        <p id="poetry-round" class="eyebrow"></p>
        <button id="poetry-reveal" class="icon-button" type="button" aria-label="揭晓诗句" title="长按揭晓诗句">
          <svg class="icon-button-ring" viewBox="0 0 48 48" aria-hidden="true">
            <circle class="icon-button-ring-track" cx="24" cy="24" r="22" />
            <circle class="icon-button-ring-fill" data-hold-fill cx="24" cy="24" r="22" />
          </svg>
          <svg class="icon-button-glyph" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4v16" /><path d="M6.029 4.285A2 2 0 0 0 3 6v12a2 2 0 0 0 3.029 1.715l9.997-5.998a2 2 0 0 0 .003-3.432z" /></svg>
        </button>
      </div>
      <p id="poetry-match" class="poetry-match" hidden></p>
      <p id="poetry-announcement" class="sr-only" role="status" aria-live="polite"></p>
      <p id="poetry-toast" class="poetry-toast" hidden></p>
      <section class="poetry-card" aria-labelledby="poetry-title" aria-label="拼出诗句">
        <div class="card-heading" id="poetry-heading" hidden>
          <h2 id="poetry-title"></h2>
        </div>
        <div id="poetry-slots" class="poetry-slots"></div>
        <p id="poetry-source" class="poetry-source" aria-live="polite" hidden></p>
        <button id="poetry-review" class="quiet-button poetry-review" type="button" aria-expanded="false" aria-controls="poetry-tiles" hidden>查看字盘</button>
        <div id="poetry-tiles" class="poetry-tiles"></div>
        <div class="poetry-actions poetry-edit-actions"><button id="poetry-clear" class="quiet-button">清空</button><button id="poetry-submit"
            disabled>提交</button></div>
      </section>
      <div class="poetry-actions poetry-navigation"><button id="poetry-next" class="quiet-button">跳过</button></div>
    </div>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>

</html>
