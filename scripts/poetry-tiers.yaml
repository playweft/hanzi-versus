# 题池总表：全库选句与难度的唯一来源。
#
#   author  作者
#   title   篇名
#   anchor  定位句，用于在语料里定位原诗；默认取 lines 的第一句，同名多首时必须写明
#   lines   该篇进题库的句子，按原诗顺序
#   tier    整篇难度：basic 入门 / normal 普通 / advanced 进阶
#   overrides  单独定档的句子，未列出的跟 tier
#
# 出处另记四处：课标目录、扩展复核、通行异文、名句补充。它们只登记篇目与理由，不写句子。
# 这里的篇目必须与出处登记完全对应：漏登或多登一篇，构建都会失败。

# ── basic ──

- author: 于谦
  title: 石灰吟
  lines: [千锤万凿出深山, 烈火焚烧若等闲, 粉骨碎身浑不怕, 要留清白在人间]
  tier: basic

- author: 刘禹锡
  title: 望洞庭
  lines: [湖光秋月两相和, 潭面无风镜未磨, 遥望洞庭山水色, 白银盘里一青螺]
  tier: basic

- author: 刘禹锡
  title: 浪淘沙
  lines: [九曲黄河万里沙, 浪淘风簸自天涯, 如今直上银河去, 同到牵牛织女家]
  tier: basic

- author: 北朝民歌
  title: 敕勒歌
  lines: [风吹草低见牛羊]
  tier: basic

- author: 卢纶
  title: 塞下曲
  anchor: 月黑雁飞高
  lines: [月黑雁飞高, 单于夜遁逃, 欲将轻骑逐, 大雪满弓刀]
  tier: basic

- author: 叶绍翁
  title: 游园不值
  lines: [应怜屐齿印苍苔, 小扣柴扉久不开, 春色满园关不住, 一枝红杏出墙来]
  tier: basic

- author: 孟浩然
  title: 春晓
  lines: [春眠不觉晓, 处处闻啼鸟, 夜来风雨声, 花落知多少]
  tier: basic

- author: 孟郊
  title: 游子吟
  lines:
    [慈母手中线, 游子身上衣, 临行密密缝, 意恐迟迟归, 谁言寸草心, 报得三春晖]
  tier: basic

- author: 张志和
  title: 渔歌子
  lines: [西塞山前白鹭飞, 桃花流水鳜鱼肥, 斜风细雨不须归]
  tier: basic

- author: 张继
  title: 枫桥夜泊
  lines: [月落乌啼霜满天, 江枫渔火对愁眠, 姑苏城外寒山寺, 夜半钟声到客船]
  tier: basic

- author: 曾几
  title: 三衢道中
  lines: [梅子黄时日日晴, 小溪泛尽却山行, 绿阴不减来时路, 添得黄鹂四五声]
  tier: basic

- author: 朱熹
  title: 春日
  lines: [胜日寻芳泗水滨, 无边光景一时新, 等闲识得东风面, 万紫千红总是春]
  tier: basic

- author: 朱熹
  title: 观书有感
  anchor: 半亩方塘一鉴开
  lines: [半亩方塘一鉴开, 天光云影共徘徊, 问渠那得清如许, 为有源头活水来]
  tier: basic

- author: 李峤
  title: 风
  lines: [解落三秋叶, 能开二月花, 过江千尺浪, 入竹万竿斜]
  tier: basic

- author: 李清照
  title: 夏日绝句
  lines: [生当作人杰, 死亦为鬼雄, 至今思项羽, 不肯过江东]
  tier: basic

- author: 李白
  title: 古朗月行
  lines: [小时不识月, 呼作白玉盘, 又疑瑶台镜, 飞在青云端]
  tier: basic

- author: 李白
  title: 夜宿山寺
  lines: [危楼高百尺, 手可摘星辰]
  tier: basic

- author: 李白
  title: 早发白帝城
  lines: [朝辞白帝彩云间, 千里江陵一日还, 两岸猿声啼不住, 轻舟已过万重山]
  tier: basic

- author: 李白
  title: 望天门山
  lines: [天门中断楚江开, 碧水东流至此回, 两岸青山相对出, 孤帆一片日边来]
  tier: basic

- author: 李白
  title: 望庐山瀑布
  lines: [日照香炉生紫烟, 遥看瀑布挂前川, 飞流直下三千尺, 疑是银河落九天]
  tier: basic

- author: 李白
  title: 赠汪伦
  lines: [李白乘舟将欲行, 忽闻岸上踏歌声, 桃花潭水深千尺, 不及汪伦送我情]
  tier: basic

- author: 李白
  title: 静夜思
  lines: [床前明月光, 疑是地上霜, 举头望明月, 低头思故乡]
  tier: basic

- author: 李白
  title: 黄鹤楼送孟浩然之广陵
  lines: [故人西辞黄鹤楼, 烟花三月下扬州, 孤帆远影碧空尽, 唯见长江天际流]
  tier: basic

- author: 李绅
  title: 悯农
  anchor: 锄禾日当午
  lines: [锄禾日当午, 汗滴禾下土, 谁知盘中餐, 粒粒皆辛苦]
  tier: basic

- author: 李绅
  title: 悯农
  anchor: 春种一粒粟
  lines: [春种一粒粟, 秋收万颗子, 四海无闲田, 农夫犹饿死]
  tier: basic

- author: 李贺
  title: 马诗·其五
  lines: [大漠沙如雪, 燕山月似钩]
  tier: basic

- author: 杜牧
  title: 山行
  lines: [远上寒山石径斜, 白云生处有人家, 停车坐爱枫林晚, 霜叶红于二月花]
  tier: basic

- author: 杜牧
  title: 江南春
  lines: [千里莺啼绿映红, 水村山郭酒旗风, 南朝四百八十寺, 多少楼台烟雨中]
  tier: basic

- author: 杜牧
  title: 清明
  lines: [清明时节雨纷纷, 路上行人欲断魂, 借问酒家何处有, 牧童遥指杏花村]
  tier: basic

- author: 杜甫
  title: 奉赠韦左丞丈二十二韵
  lines: [读书破万卷, 下笔如有神]
  tier: basic

- author: 杜甫
  title: 春夜喜雨
  lines:
    [
      好雨知时节,
      当春乃发生,
      随风潜入夜,
      润物细无声,
      野径云俱黑,
      江船火独明,
      晓看红湿处,
      花重锦官城,
    ]
  tier: basic

- author: 杜甫
  title: 江畔独步寻花
  anchor: 黄师塔前江水东
  lines: [黄师塔前江水东, 春光懒困倚微风, 桃花一簇开无主, 可爱深红爱浅红]
  tier: basic

- author: 杜甫
  title: 绝句
  anchor: 两个黄鹂鸣翠柳
  lines: [两个黄鹂鸣翠柳, 一行白鹭上青天, 窗含西岭千秋雪, 门泊东吴万里船]
  tier: basic

- author: 杜甫
  title: 绝句
  anchor: 迟日江山丽
  lines: [迟日江山丽, 春风花草香, 泥融飞燕子, 沙暖睡鸳鸯]
  tier: basic

- author: 杨万里
  title: 宿新市徐公店
  lines: [儿童急走追黄蝶, 飞入菜花无处寻]
  tier: basic

- author: 杨万里
  title: 小池
  lines: [泉眼无声惜细流, 树阴照水爱晴柔, 小荷才露尖尖角, 早有蜻蜓立上头]
  tier: basic

- author: 杨万里
  title: 晓出净慈寺送林子方
  lines: [毕竟西湖六月中, 风光不与四时同, 接天莲叶无穷碧, 映日荷花别样红]
  tier: basic

- author: 林升
  title: 题临安邸
  lines: [山外青山楼外楼, 西湖歌舞几时休, 暖风熏得游人醉, 直把杭州作汴州]
  tier: basic

- author: 柳宗元
  title: 江雪
  lines: [千山鸟飞绝, 万径人踪灭, 孤舟蓑笠翁, 独钓寒江雪]
  tier: basic

- author: 汉乐府
  title: 江南
  lines:
    [
      江南可采莲,
      莲叶何田田,
      鱼戏莲叶间,
      鱼戏莲叶东,
      鱼戏莲叶西,
      鱼戏莲叶南,
      鱼戏莲叶北,
    ]
  tier: basic

- author: 汉乐府
  title: 长歌行
  lines:
    [
      青青园中葵,
      朝露待日晞,
      阳春布德泽,
      万物生光辉,
      常恐秋节至,
      焜黄华叶衰,
      百川东到海,
      何时复西归,
      少壮不努力,
      老大徒伤悲,
    ]
  tier: basic

- author: 王之涣
  title: 凉州词
  lines: [黄河远上白云间, 一片孤城万仞山, 羌笛何须怨杨柳, 春风不度玉门关]
  tier: basic

- author: 王之涣
  title: 登鹳雀楼
  lines: [白日依山尽, 黄河入海流, 欲穷千里目, 更上一层楼]
  tier: basic

- author: 王冕
  title: 墨梅
  lines: [我家洗砚池头树, 朵朵花开淡墨痕, 不要人夸好颜色, 只留清气满乾坤]
  tier: basic

- author: 王安石
  title: 书湖阴先生壁
  lines: [茅檐长扫净无苔, 花木成畦手自栽, 一水护田将绿绕, 两山排闼送青来]
  tier: basic

- author: 王安石
  title: 元日
  lines: [爆竹声中一岁除, 春风送暖入屠苏, 千门万户曈曈日, 总把新桃换旧符]
  tier: basic

- author: 王安石
  title: 泊船瓜洲
  lines: [京口瓜洲一水间, 钟山只隔数重山, 春风又绿江南岸, 明月何时照我还]
  tier: basic

- author: 王昌龄
  title: 出塞二首·其一
  lines: [秦时明月汉时关, 万里长征人未还, 但使龙城飞将在, 不教胡马度阴山]
  tier: basic

- author: 王昌龄
  title: 芙蓉楼送辛渐
  lines: [寒雨连江夜入吴, 平明送客楚山孤, 洛阳亲友如相问, 一片冰心在玉壶]
  tier: basic

- author: 王维
  title: 九月九日忆山东兄弟
  lines: [独在异乡为异客, 每逢佳节倍思亲, 遥知兄弟登高处, 遍插茱萸少一人]
  tier: basic

- author: 王维
  title: 渭城曲
  lines: [渭城朝雨浥轻尘, 客舍青青柳色新, 劝君更尽一杯酒, 西出阳关无故人]
  tier: basic

- author: 王维
  title: 相思
  lines: [红豆生南国, 春来发几枝, 愿君多采撷, 此物最相思]
  tier: basic

- author: 王维
  title: 鹿柴
  lines: [空山不见人, 但闻人语响, 返景入深林, 复照青苔上]
  tier: basic

- author: 王翰
  title: 凉州词
  lines: [葡萄美酒夜光杯, 欲饮琵琶马上催, 醉卧沙场君莫笑, 古来征战几人回]
  tier: basic

- author: 王贞白
  title: 白鹿洞二首·其一
  lines: [一寸光阴一寸金]
  tier: basic

- author: 白居易
  title: 忆江南
  lines: [风景旧曾谙, 日出江花红胜火, 春来江水绿如蓝, 能不忆江南]
  tier: basic

- author: 白居易
  title: 池上
  lines: [小娃撑小艇, 偷采白莲回, 不解藏踪迹, 浮萍一道开]
  tier: basic

- author: 白居易
  title: 赋得古原草送别
  lines: [离离原上草, 一岁一枯荣, 野火烧不尽, 春风吹又生]
  tier: basic

- author: 罗隐
  title: 蜂
  lines: [不论平地与山尖, 无限风光尽被占, 采得百花成蜜后, 为谁辛苦为谁甜]
  tier: basic

- author: 翁卷
  title: 乡村四月
  lines: [绿遍山原白满川, 子规声里雨如烟, 乡村四月闲人少, 才了蚕桑又插田]
  tier: basic

- author: 胡令能
  title: 小儿垂钓
  lines: [蓬头稚子学垂纶, 侧坐莓苔草映身, 路人借问遥招手, 怕得鱼惊不应人]
  tier: basic

- author: 苏轼
  title: 六月二十七日望湖楼醉书
  lines: [黑云翻墨未遮山, 白雨跳珠乱入船, 卷地风来忽吹散, 望湖楼下水如天]
  tier: basic

- author: 苏轼
  title: 惠崇春江晓景
  lines: [竹外桃花三两枝, 春江水暖鸭先知, 蒌蒿满地芦芽短, 正是河豚欲上时]
  tier: basic

- author: 苏轼
  title: 题西林壁
  lines: [横看成岭侧成峰, 远近高低各不同, 不识庐山真面目, 只缘身在此山中]
  tier: basic

- author: 苏轼
  title: 饮湖上初晴后雨
  lines: [水光潋滟晴方好, 山色空蒙雨亦奇, 欲把西湖比西子, 淡妆浓抹总相宜]
  tier: basic

- author: 范仲淹
  title: 江上渔者
  lines: [江上往来人, 但爱鲈鱼美, 君看一叶舟, 出没风波里]
  tier: basic

- author: 范成大
  title: 四时田园杂兴
  anchor: 昼出耘田夜绩麻
  lines: [昼出耘田夜绩麻, 村庄儿女各当家, 童孙未解供耕织, 也傍桑阴学种瓜]
  tier: basic

- author: 范成大
  title: 四时田园杂兴
  anchor: 梅子金黄杏子肥
  lines: [梅子金黄杏子肥, 麦花雪白菜花稀, 日长篱落无人过, 惟有蜻蜓蛱蝶飞]
  tier: basic

- author: 袁枚
  title: 所见
  lines: [牧童骑黄牛, 歌声振林樾, 意欲捕鸣蝉, 忽然闭口立]
  tier: basic

- author: 贺知章
  title: 咏柳
  lines: [碧玉妆成一树高, 万条垂下绿丝绦, 不知细叶谁裁出, 二月春风似剪刀]
  tier: basic

- author: 贺知章
  title: 回乡偶书
  lines: [少小离家老大回, 乡音无改鬓毛衰, 儿童相见不相识, 笑问客从何处来]
  tier: basic

- author: 贾岛
  title: 寻隐者不遇
  lines: [松下问童子, 言师采药去, 只在此山中, 云深不知处]
  tier: basic

- author: 郑燮
  title: 竹石
  lines: [咬定青山不放松, 立根原在破岩中, 千磨万击还坚劲, 任尔东西南北风]
  tier: basic

- author: 陆游
  title: 示儿
  lines: [死去元知万事空, 但悲不见九州同, 王师北定中原日, 家祭无忘告乃翁]
  tier: basic

- author: 陆游
  title: 秋夜将晓出篱门迎凉有感
  lines: [三万里河东入海, 五千仞岳上摩天, 遗民泪尽胡尘里, 南望王师又一年]
  tier: basic

- author: 韦应物
  title: 滁州西涧
  lines: [独怜幽草涧边生, 上有黄鹂深树鸣, 春潮带雨晚来急, 野渡无人舟自横]
  tier: basic

- author: 韩愈
  title: 早春呈水部张十八员外
  lines: [天街小雨润如酥, 草色遥看近却无, 最是一年春好处, 绝胜烟柳满皇都]
  tier: basic

- author: 颜真卿
  title: 劝学诗
  lines: [三更灯火五更鸡, 正是男儿读书时, 黑发不知勤学早, 白首方悔读书迟]
  tier: basic

- author: 骆宾王
  title: 咏鹅
  lines: [曲项向天歌, 白毛浮绿水, 红掌拨清波]
  tier: basic

- author: 高适
  title: 别董大
  lines: [千里黄云白日曛, 北风吹雁雪纷纷, 莫愁前路无知己, 天下谁人不识君]
  tier: basic

- author: 高鼎
  title: 村居
  lines: [草长莺飞二月天, 拂堤杨柳醉春烟, 儿童散学归来早, 忙趁东风放纸鸢]
  tier: basic

- author: 龚自珍
  title: 己亥杂诗
  anchor: 九州生气恃风雷
  lines: [九州生气恃风雷, 万马齐喑究可哀, 我劝天公重抖擞, 不拘一格降人材]
  tier: basic

# ── normal ──

- author: 佚名
  title: 涉江采芙蓉
  lines:
    [
      涉江采芙蓉,
      兰泽多芳草,
      采之欲遗谁,
      所思在远道,
      还顾望旧乡,
      长路漫浩浩,
      同心而离居,
      忧伤以终老,
    ]
  tier: normal

- author: 佚名
  title: 蒹葭
  lines: [宛在水中央, 宛在水中坻, 宛在水中沚]
  tier: normal

- author: 刘禹锡
  title: 秋词
  lines: [自古逢秋悲寂寥, 我言秋日胜春朝, 晴空一鹤排云上, 便引诗情到碧霄]
  tier: normal

- author: 刘禹锡
  title: 酬乐天咏老见示
  lines: [莫道桑榆晚, 为霞尚满天]
  tier: normal

- author: 刘禹锡
  title: 酬乐天扬州初逢席上见赠
  lines:
    [
      巴山楚水凄凉地,
      二十三年弃置身,
      怀旧空吟闻笛赋,
      到乡翻似烂柯人,
      沉舟侧畔千帆过,
      病树前头万木春,
      今日听君歌一曲,
      暂凭杯酒长精神,
    ]
  tier: normal

- author: 北朝民歌
  title: 木兰辞
  lines:
    [
      唧唧复唧唧,
      木兰当户织,
      万里赴戎机,
      关山度若飞,
      朔气传金柝,
      寒光照铁衣,
      将军百战死,
      壮士十年归,
      当窗理云鬓,
      对镜帖花黄,
      雄兔脚扑朔,
      雌兔眼迷离,
      双兔傍地走,
      安能辨我是雄雌,
    ]
  tier: normal

- author: 周邦彦
  title: 苏幕遮·燎沉香
  lines: [叶上初阳干宿雨, 一一风荷举, 五月渔郎相忆否, 梦入芙蓉浦]
  tier: normal

- author: 孟浩然
  title: 过故人庄
  lines:
    [
      故人具鸡黍,
      邀我至田家,
      绿树村边合,
      青山郭外斜,
      开轩面场圃,
      把酒话桑麻,
      待到重阳日,
      还来就菊花,
    ]
  tier: normal

- author: 孟郊
  title: 登科后
  lines: [春风得意马蹄疾, 一日看尽长安花]
  tier: normal

- author: 岑参
  title: 白雪歌送武判官归京
  lines:
    [
      北风卷地白草折,
      胡天八月即飞雪,
      忽如一夜春风来,
      千树万树梨花开,
      瀚海阑干百丈冰,
      愁云惨淡万里凝,
      山回路转不见君,
      雪上空留马行处,
    ]
  tier: normal

- author: 崔颢
  title: 黄鹤楼
  lines:
    [
      昔人已乘黄鹤去,
      此地空余黄鹤楼,
      黄鹤一去不复返,
      白云千载空悠悠,
      晴川历历汉阳树,
      芳草萋萋鹦鹉洲,
      日暮乡关何处是,
      烟波江上使人愁,
    ]
  tier: normal

- author: 常建
  title: 题破山寺后禅院
  lines:
    [
      清晨入古寺,
      初日照高林,
      曲径通幽处,
      禅房花木深,
      山光悦鸟性,
      潭影空人心,
      万籁此俱寂,
      惟闻钟磬音,
    ]
  tier: normal

- author: 张养浩
  title: 山坡羊·潼关怀古
  lines: [山河表里潼关路, 伤心秦汉经行处]
  tier: normal

- author: 张若虚
  title: 春江花月夜
  lines:
    [
      春江潮水连海平,
      海上明月共潮生,
      滟滟随波千万里,
      何处春江无月明,
      江天一色无纤尘,
      皎皎空中孤月轮,
      江畔何人初见月,
      江月何年初照人,
      人生代代无穷已,
      江月年年望相似,
      不知江月待何人,
      但见长江送流水,
    ]
  tier: normal

- author: 文天祥
  title: 过零丁洋
  lines:
    [
      辛苦遭逢起一经,
      干戈寥落四周星,
      山河破碎风飘絮,
      身世浮沉雨打萍,
      惶恐滩头说惶恐,
      零丁洋里叹零丁,
      人生自古谁无死,
      留取丹心照汗青,
    ]
  tier: normal

- author: 晏几道
  title: 临江仙·梦后楼台高锁
  lines: [当时明月在, 曾照彩云归]
  tier: normal

- author: 晏殊
  title: 浣溪沙
  lines:
    [
      一曲新词酒一杯,
      去年天气旧亭台,
      夕阳西下几时回,
      无可奈何花落去,
      似曾相识燕归来,
      小园香径独徘徊,
    ]
  tier: normal

- author: 李之仪
  title: 卜算子·我住长江头
  lines: [只愿君心似我心]
  tier: normal

- author: 李商隐
  title: 夜雨寄北
  lines: [君问归期未有期, 巴山夜雨涨秋池, 何当共剪西窗烛, 却话巴山夜雨时]
  tier: normal

- author: 李商隐
  title: 无题
  anchor: 相见时难别亦难
  lines:
    [
      相见时难别亦难,
      东风无力百花残,
      春蚕到死丝方尽,
      蜡炬成灰泪始干,
      晓镜但愁云鬓改,
      夜吟应觉月光寒,
      蓬山此去无多路,
      青鸟殷勤为探看,
    ]
  tier: normal

- author: 李商隐
  title: 锦瑟
  lines:
    [
      锦瑟无端五十弦,
      一弦一柱思华年,
      庄生晓梦迷蝴蝶,
      望帝春心托杜鹃,
      沧海月明珠有泪,
      蓝田日暖玉生烟,
      此情可待成追忆,
      只是当时已惘然,
    ]
  tier: normal

- author: 李清照
  title: 声声慢·寻寻觅觅
  lines: [怎一个愁字了得]
  tier: normal

- author: 李清照
  title: 渔家傲
  lines:
    [
      天接云涛连晓雾,
      星河欲转千帆舞,
      仿佛梦魂归帝所,
      殷勤问我归何处,
      我报路长嗟日暮,
      学诗谩有惊人句,
      九万里风鹏正举,
      蓬舟吹取三山去,
    ]
  tier: normal

- author: 李煜
  title: 虞美人（春花秋月何时了）
  lines:
    [
      春花秋月何时了,
      往事知多少,
      小楼昨夜又东风,
      雕栏玉砌应犹在,
      只是朱颜改,
      问君能有几多愁,
    ]
  tier: normal

- author: 李白
  title: 上李邕
  lines: [大鹏一日同风起, 扶摇直上九万里]
  tier: normal

- author: 李白
  title: 南陵别儿童入京
  lines: [仰天大笑出门去, 我辈岂是蓬蒿人]
  tier: normal

- author: 李白
  title: 宣州谢朓楼饯别校书叔云
  lines: [抽刀断水水更流, 举杯消愁愁更愁]
  tier: normal

- author: 李白
  title: 将进酒
  lines:
    [
      黄河之水天上来,
      奔流到海不复回,
      高堂明镜悲白发,
      朝如青丝暮成雪,
      人生得意须尽欢,
      莫使金樽空对月,
      天生我材必有用,
      千金散尽还复来,
      古来圣贤皆寂寞,
      惟有饮者留其名,
    ]
  tier: normal

- author: 李白
  title: 峨眉山月歌
  lines: [峨眉山月半轮秋, 影入平羌江水流, 夜发清溪向三峡, 思君不见下渝州]
  tier: normal

- author: 李白
  title: 月下独酌四首·其一
  lines:
    [花间一壶酒, 独酌无相亲, 举杯邀明月, 对影成三人, 我歌月徘徊, 我舞影零乱]
  tier: normal

- author: 李白
  title: 梦游天姥吟留别
  anchor: 海客谈瀛洲
  lines:
    [
      海客谈瀛洲,
      烟涛微茫信难求,
      越人语天姥,
      云霞明灭或可睹,
      天姥连天向天横,
      势拔五岳掩赤城,
      我欲因之梦吴越,
      一夜飞度镜湖月,
      世间行乐亦如此,
      古来万事东流水,
      使我不得开心颜,
    ]
  tier: normal

- author: 李白
  title: 梦游天姥吟留别
  anchor: 且放白鹿青崖间
  lines: [且放白鹿青崖间, 须行即骑访名山]
  tier: normal

- author: 李白
  title: 渡荆门送别
  lines:
    [
      渡远荆门外,
      来从楚国游,
      山随平野尽,
      江入大荒流,
      月下飞天镜,
      云生结海楼,
      仍怜故乡水,
      万里送行舟,
    ]
  tier: normal

- author: 李白
  title: 经乱离后天恩流夜郎忆旧游书怀赠江夏韦太守良宰
  lines: [清水出芙蓉, 天然去雕饰]
  tier: normal

- author: 李白
  title: 蜀道难
  lines:
    [
      难于上青天,
      西当太白有鸟道,
      可以横绝峨眉巅,
      连峰去天不盈尺,
      枯松倒挂倚绝壁,
      剑阁峥嵘而崔嵬,
    ]
  tier: normal

- author: 李白
  title: 行路难
  lines:
    [
      金樽清酒斗十千,
      玉盘珍羞直万钱,
      停杯投箸不能食,
      拔剑四顾心茫然,
      欲渡黄河冰塞川,
      将登太行雪满山,
      闲来垂钓碧溪上,
      忽复乘舟梦日边,
      长风破浪会有时,
      直挂云帆济沧海,
    ]
  tier: normal

- author: 李白
  title: 长干行
  lines: [郎骑竹马来, 绕床弄青梅]
  tier: normal

- author: 李白
  title: 闻王昌龄左迁龙标遥有此寄
  lines: [杨花落尽子规啼, 闻道龙标过五溪, 我寄愁心与明月, 随君直到夜郎西]
  tier: normal

- author: 李贺
  title: 李凭箜篌引
  lines: [昆山玉碎凤凰叫, 芙蓉泣露香兰笑, 女娲炼石补天处, 石破天惊逗秋雨]
  tier: normal

- author: 李贺
  title: 金铜仙人辞汉歌
  lines: [天若有情天亦老]
  tier: normal

- author: 李贺
  title: 雁门太守行
  lines:
    [
      黑云压城城欲摧,
      甲光向日金鳞开,
      角声满天秋色里,
      塞上燕脂凝夜紫,
      半卷红旗临易水,
      霜重鼓寒声不起,
      报君黄金台上意,
      提携玉龙为君死,
    ]
  tier: normal

- author: 杜牧
  title: 泊秦淮
  lines: [烟笼寒水月笼沙, 夜泊秦淮近酒家, 商女不知亡国恨, 隔江犹唱后庭花]
  tier: normal

- author: 杜牧
  title: 赤壁
  lines: [折戟沉沙铁未销, 自将磨洗认前朝, 东风不与周郎便, 铜雀春深锁二乔]
  tier: normal

- author: 杜牧
  title: 过华清宫
  lines: [长安回望绣成堆, 山顶千门次第开, 一骑红尘妃子笑, 无人知是荔枝来]
  tier: normal

- author: 杜甫
  title: 客至
  lines:
    [
      舍南舍北皆春水,
      但见群鸥日日来,
      花径不曾缘客扫,
      蓬门今始为君开,
      盘飧市远无兼味,
      樽酒家贫只旧醅,
      肯与邻翁相对饮,
      隔篱呼取尽余杯,
    ]
  tier: normal

- author: 杜甫
  title: 旅夜书怀
  anchor: 细草微风岸
  lines: [星垂平野阔, 月涌大江流]
  tier: normal

- author: 杜甫
  title: 春望
  lines:
    [
      国破山河在,
      城春草木深,
      感时花溅泪,
      恨别鸟惊心,
      烽火连三月,
      家书抵万金,
      白头搔更短,
      浑欲不胜簪,
    ]
  tier: normal

- author: 杜甫
  title: 月夜忆舍弟
  anchor: 戍鼓断人行
  lines: [露从今夜白, 月是故乡明]
  tier: normal

- author: 杜甫
  title: 望岳
  lines:
    [
      岱宗夫如何,
      齐鲁青未了,
      造化钟神秀,
      阴阳割昏晓,
      荡胸生曾云,
      决眦入归鸟,
      会当凌绝顶,
      一览众山小,
    ]
  tier: normal

- author: 杜甫
  title: 登岳阳楼
  lines:
    [
      昔闻洞庭水,
      今上岳阳楼,
      吴楚东南坼,
      乾坤日夜浮,
      亲朋无一字,
      老病有孤舟,
      戎马关山北,
      凭轩涕泗流,
    ]
  tier: normal

- author: 杜甫
  title: 登高
  lines:
    [
      风急天高猿啸哀,
      渚清沙白鸟飞回,
      无边落木萧萧下,
      不尽长江滚滚来,
      万里悲秋常作客,
      百年多病独登台,
      艰难苦恨繁霜鬓,
      潦倒新停浊酒杯,
    ]
  tier: normal

- author: 杜甫
  title: 茅屋为秋风所破歌
  lines:
    [
      八月秋高风怒号,
      卷我屋上三重茅,
      床头屋漏无干处,
      雨脚如麻未断绝,
      安得广厦千万间,
    ]
  tier: normal

- author: 杜甫
  title: 蜀相
  lines:
    [
      丞相祠堂何处寻,
      锦官城外柏森森,
      映阶碧草自春色,
      隔叶黄鹂空好音,
      三顾频烦天下计,
      两朝开济老臣心,
      出师未捷身先死,
      长使英雄泪满襟,
    ]
  tier: normal

- author: 杜甫
  title: 闻官军收河南河北
  lines:
    [
      剑外忽传收蓟北,
      初闻涕泪满衣裳,
      却看妻子愁何在,
      漫卷诗书喜欲狂,
      白日放歌须纵酒,
      青春作伴好还乡,
      即从巴峡穿巫峡,
      便下襄阳向洛阳,
    ]
  tier: normal

- author: 柳永
  title: 望海潮
  lines: [云树绕堤沙, 怒涛卷霜雪, 有三秋桂子]
  tier: normal

- author: 柳永
  title: 蝶恋花
  lines: [衣带渐宽终不悔, 为伊消得人憔悴]
  tier: normal

- author: 欧阳修
  title: 生查子·元夕
  lines: [月上柳梢头, 人约黄昏后]
  tier: normal

- author: 汉乐府
  title: 十五从军征
  lines:
    [
      十五从军征,
      八十始得归,
      道逢乡里人,
      家中有阿谁,
      遥看是君家,
      松柏冢累累,
      兔从狗窦入,
      雉从梁上飞,
      中庭生旅谷,
      井上生旅葵,
      舂谷持作饭,
      采葵持作羹,
      羹饭一时熟,
      不知饴阿谁,
      出门东向看,
      泪落沾我衣,
    ]
  tier: normal

- author: 温庭筠
  title: 菩萨蛮
  lines:
    [
      小山重叠金明灭,
      鬓云欲度香腮雪,
      懒起画蛾眉,
      弄妆梳洗迟,
      照花前后镜,
      花面交相映,
      新帖绣罗襦,
      双双金鹧鸪,
    ]
  tier: normal

- author: 王勃
  title: 送杜少府之任蜀州
  lines:
    [
      城阙辅三秦,
      风烟望五津,
      与君离别意,
      同是宦游人,
      海内存知己,
      天涯若比邻,
      无为在岐路,
      儿女共沾巾,
    ]
  tier: normal

- author: 王安石
  title: 桂枝香·金陵怀古
  lines: [归帆去棹残阳里, 六朝旧事随流水]
  tier: normal

- author: 王安石
  title: 梅花
  lines: [墙角数枝梅, 凌寒独自开, 遥知不是雪, 为有暗香来]
  tier: normal

- author: 王安石
  title: 登飞来峰
  lines: [飞来山上千寻塔, 闻说鸡鸣见日升, 不畏浮云遮望眼, 自缘身在最高层]
  tier: normal

- author: 王实甫
  title: 长亭送别
  lines: [晓来谁染霜林醉, 总是离人泪]
  tier: normal

- author: 王湾
  title: 次北固山下
  lines:
    [
      客路青山外,
      行舟绿水前,
      潮平两岸阔,
      风正一帆悬,
      海日生残夜,
      江春入旧年,
      乡书何处达,
      归雁洛阳边,
    ]
  tier: normal

- author: 王磐
  title: 朝天子·咏喇叭
  lines: [官船来往乱如麻]
  tier: advanced

- author: 王维
  title: 使至塞上
  lines:
    [
      单车欲问边,
      属国过居延,
      征蓬出汉塞,
      归雁入胡天,
      大漠孤烟直,
      长河落日圆,
      萧关逢候骑,
      都护在燕然,
    ]
  tier: normal

- author: 王维
  title: 山居秋暝
  lines:
    [
      空山新雨后,
      天气晚来秋,
      明月松间照,
      清泉石上流,
      竹喧归浣女,
      莲动下渔舟,
      随意春芳歇,
      王孙自可留,
    ]
  tier: normal

- author: 王维
  title: 杂诗
  lines: [君自故乡来, 应知故乡事, 来日绮窗前, 寒梅著花未]
  tier: normal

- author: 王维
  title: 竹里馆
  lines: [独坐幽篁里, 弹琴复长啸, 深林人不知, 明月来相照]
  tier: normal

- author: 王维
  title: 终南别业
  anchor: 中岁颇好道
  lines: [行到水穷处, 坐看云起时]
  tier: normal

- author: 白居易
  title: 卖炭翁
  lines:
    [
      满面尘灰烟火色,
      两鬓苍苍十指黑,
      可怜身上衣正单,
      心忧炭贱愿天寒,
      夜来城外一尺雪,
      晓驾炭车辗冰辙,
    ]
  tier: normal

- author: 白居易
  title: 琵琶行
  lines:
    [
      千呼万唤始出来,
      犹抱琵琶半遮面,
      转轴拨弦三两声,
      未成曲调先有情,
      大弦嘈嘈如急雨,
      小弦切切如私语,
      嘈嘈切切错杂弹,
      大珠小珠落玉盘,
      别有幽愁暗恨生,
      此时无声胜有声,
      同是天涯沦落人,
      相逢何必曾相识,
    ]
  tier: normal

- author: 白居易
  title: 钱塘湖春行
  lines:
    [
      孤山寺北贾亭西,
      水面初平云脚低,
      几处早莺争暖树,
      谁家新燕啄春泥,
      乱花渐欲迷人眼,
      浅草才能没马蹄,
      最爱湖东行不足,
      绿杨阴里白沙堤,
    ]
  tier: normal

- author: 秋瑾
  title: 满江红
  lines: [四面歌残终破楚, 八年风味徒思浙, 俗子胸襟谁识我, 英雄末路当磨折]
  tier: normal

- author: 秦观
  title: 鹊桥仙·纤云弄巧
  lines: [金风玉露一相逢, 便胜却人间无数, 两情若是久长时, 又岂在朝朝暮暮]
  tier: normal

- author: 纳兰性德
  title: 木兰花令·拟古决绝词
  lines: [人生若只如初见, 何事秋风悲画扇]
  tier: normal

- author: 纳兰性德
  title: 浣溪沙·谁念西风独自凉
  lines: [赌书消得泼茶香, 当时只道是寻常]
  tier: normal

- author: 苏轼
  title: 和子由渑池怀旧
  lines: [人生到处知何似, 应似飞鸿踏雪泥]
  tier: normal

- author: 苏轼
  title: 和董传留别
  lines: [腹有诗书气自华]
  tier: normal

- author: 苏轼
  title: 定风波·南海归赠王定国侍人寓娘
  lines: [此心安处是吾乡]
  tier: normal

- author: 苏轼
  title: 定风波·莫听穿林打叶声
  lines: [一蓑烟雨任平生, 也无风雨也无晴]
  tier: normal

- author: 苏轼
  title: 念奴娇·赤壁怀古
  lines: [卷起千堆雪, 小乔初嫁了, 多情应笑我]
  tier: normal

- author: 苏轼
  title: 望江南·超然台作
  lines: [诗酒趁年华]
  tier: normal

- author: 苏轼
  title: 水调歌头
  lines:
    [
      明月几时有,
      把酒问青天,
      今夕是何年,
      高处不胜寒,
      起舞弄清影,
      何似在人间,
      何事长向别时圆,
      此事古难全,
      但愿人长久,
      千里共婵娟,
    ]
  tier: normal

- author: 苏轼
  title: 江城子
  lines:
    [
      老夫聊发少年狂,
      千骑卷平冈,
      为报倾城随太守,
      酒酣胸胆尚开张,
      何日遣冯唐,
      会挽雕弓如满月,
    ]
  tier: normal

- author: 苏轼
  title: 江城子·乙卯正月二十日夜记梦
  lines:
    [
      十年生死两茫茫,
      无处话凄凉,
      纵使相逢应不识,
      夜来幽梦忽还乡,
      惟有泪千行,
      料得年年肠断处,
    ]
  tier: normal

- author: 苏轼
  title: 浣溪沙·细雨斜风作晓寒
  lines: [人间有味是清欢]
  tier: normal

- author: 苏轼
  title: 蝶恋花·春景
  lines: [天涯何处无芳草, 多情却被无情恼]
  tier: normal

- author: 范仲淹
  title: 渔家傲
  lines:
    [
      塞下秋来风景异,
      衡阳雁去无留意,
      四面边声连角起,
      长烟落日孤城闭,
      浊酒一杯家万里,
      燕然未勒归无计,
      羌管悠悠霜满地,
      将军白发征夫泪,
    ]
  tier: normal

- author: 蒋捷
  title: 虞美人·听雨
  lines: [少年听雨歌楼上, 红烛昏罗帐]
  tier: normal

- author: 许浑
  title: 咸阳城东楼
  lines: [山雨欲来风满楼]
  tier: normal

- author: 赵师秀
  title: 约客
  lines: [黄梅时节家家雨, 青草池塘处处蛙, 有约不来过夜半, 闲敲棋子落灯花]
  tier: normal

- author: 赵恒
  title: 劝学诗
  lines: [书中自有颜如玉, 书中自有黄金屋]
  tier: normal

- author: 赵翼
  title: 论诗五首·其二
  lines: [江山代有才人出, 各领风骚数百年]
  tier: normal

- author: 辛弃疾
  title: 南乡子
  lines:
    [
      何处望神州,
      满眼风光北固楼,
      千古兴亡多少事,
      不尽长江滚滚流,
      年少万兜鍪,
      坐断东南战未休,
      天下英雄谁敌手,
      生子当如孙仲谋,
    ]
  tier: normal

- author: 辛弃疾
  title: 永遇乐·京口北固亭怀古
  lines: [烽火扬州路]
  tier: normal

- author: 辛弃疾
  title: 破阵子
  lines:
    [
      八百里分麾下炙,
      五十弦翻塞外声,
      沙场秋点兵,
      了却君王天下事,
      赢得生前身后名,
      可怜白发生,
    ]
  tier: normal

- author: 辛弃疾
  title: 菩萨蛮·书江西造口壁
  lines:
    [
      郁孤台下清江水,
      中间多少行人泪,
      西北望长安,
      可怜无数山,
      青山遮不住,
      毕竟东流去,
      江晚正愁余,
      山深闻鹧鸪,
    ]
  tier: normal

- author: 辛弃疾
  title: 贺新郎·甚矣吾衰矣
  lines: [我见青山多妩媚]
  tier: normal

- author: 辛弃疾
  title: 青玉案·元夕
  lines:
    [
      东风夜放花千树,
      宝马雕车香满路,
      一夜鱼龙舞,
      蛾儿雪柳黄金缕,
      笑语盈盈暗香去,
      众里寻他千百度,
      灯火阑珊处,
    ]
  tier: normal

- author: 郑谷
  title: 淮上与友人别
  lines: [扬子江头杨柳春, 杨花愁杀渡江人, 数声风笛离亭晚, 君向潇湘我向秦]
  tier: normal

- author: 陆游
  title: 临安春雨初霁
  lines:
    [
      世味年来薄似纱,
      谁令骑马客京华,
      小楼一夜听春雨,
      深巷明朝卖杏花,
      矮纸斜行闲作草,
      晴窗细乳戏分茶,
      素衣莫起风尘叹,
      犹及清明可到家,
    ]
  tier: normal

- author: 陆游
  title: 书愤
  lines:
    [
      早岁那知世事艰,
      中原北望气如山,
      楼船夜雪瓜洲渡,
      铁马秋风大散关,
      塞上长城空自许,
      镜中衰鬓已先斑,
      出师一表真名世,
      千载谁堪伯仲间,
    ]
  tier: normal

- author: 陆游
  title: 文章
  lines: [文章本天成, 妙手偶得之]
  tier: normal

- author: 陆游
  title: 游山西村
  lines:
    [
      莫笑农家腊酒浑,
      丰年留客足鸡豚,
      山重水复疑无路,
      柳暗花明又一村,
      箫鼓追随春社近,
      衣冠简朴古风存,
      从今若许闲乘月,
      拄杖无时夜叩门,
    ]
  tier: normal

- author: 陆游
  title: 病起书怀
  lines: [位卑未敢忘忧国]
  tier: normal

- author: 陈子昂
  title: 登幽州台歌
  lines: [前不见古人, 后不见来者]
  tier: normal

- author: 陶渊明
  title: 归园田居·其一
  lines:
    [
      少无适俗韵,
      性本爱丘山,
      羁鸟恋旧林,
      池鱼思故渊,
      暧暧远人村,
      依依墟里烟,
      狗吠深巷中,
      鸡鸣桑树颠,
      久在樊笼里,
      复得返自然,
    ]
  tier: normal

- author: 陶渊明
  title: 饮酒
  lines:
    [
      结庐在人境,
      而无车马喧,
      问君何能尔,
      心远地自偏,
      采菊东篱下,
      悠然见南山,
      山气日夕佳,
      飞鸟相与还,
      此中有真意,
      欲辨已忘言,
    ]
  tier: normal

- author: 高适
  title: 燕歌行并序
  lines:
    [
      战士军前半死生,
      美人帐下犹歌舞,
      大漠穷秋塞草腓,
      孤城落日斗兵稀,
      至今犹忆李将军,
    ]
  tier: normal

- author: 鱼玄机
  title: 赠邻女
  lines: [易求无价宝, 难得有情郎]
  tier: normal

- author: 鲍照
  title: 拟行路难·其四
  lines:
    [
      泻水置平地,
      各自东西南北流,
      人生亦有命,
      安能行叹复坐愁,
      酌酒以自宽,
      举杯断绝歌路难,
      心非木石岂无感,
      吞声踯躅不敢言,
    ]
  tier: normal

- author: 黄庭坚
  title: 登快阁
  lines:
    [
      痴儿了却公家事,
      快阁东西倚晚晴,
      落木千山天远大,
      澄江一道月分明,
      朱弦已为佳人绝,
      青眼聊因美酒横,
      万里归船弄长笛,
      此心吾与白鸥盟,
    ]
  tier: normal

- author: 黄蘖禅师
  title: 上堂开示颂
  lines: [不经一番寒彻骨, 怎得梅花扑鼻香]
  tier: normal

- author: 龚自珍
  title: 己亥杂诗
  anchor: 浩荡离愁白日斜
  lines: [浩荡离愁白日斜, 吟鞭东指即天涯, 落红不是无情物, 化作春泥更护花]
  tier: normal

# ── advanced ──

- author: 丘为
  title: 左掖梨花
  lines: [冷艳全欺雪, 余香乍入衣, 春风且莫定, 吹向玉阶飞]
  tier: advanced

- author: 佚名
  title: 金缕衣
  lines: [劝君莫惜金缕衣, 劝君惜取少年时, 花开堪折直须折, 莫待无花空折枝]
  tier: advanced

- author: 佚名
  title: 静女
  lines: [俟我于城隅, 匪女之为美]
  tier: advanced

- author: 元稹
  title: 离思
  lines: [曾经沧海难为水, 除却巫山不是云, 取次花丛嬾回顾, 半缘修道半缘君]
  tier: advanced
  overrides:
    曾经沧海难为水: normal
    除却巫山不是云: normal

- author: 元稹
  title: 菊花
  lines: [秋丛绕舍似陶家, 遍绕篱边日渐斜, 不是花中偏爱菊, 此花开尽更无花]
  tier: advanced

- author: 元稹
  title: 行宫
  lines: [寥落古行宫, 宫花寂寞红, 白头宫女在, 闲坐说玄宗]
  tier: advanced

- author: 元稹
  title: 遣悲怀三首·其一
  lines: [野蔬充膳甘长藿, 落叶添薪仰古槐, 今日俸钱过十万, 与君营奠复营斋]
  tier: advanced

- author: 元稹
  title: 遣悲怀三首·其三
  lines: [闲坐悲君亦自悲, 百年都是几多时, 惟将终夜常开眼, 报答平生未展眉]
  tier: advanced

- author: 元稹
  title: 遣悲怀三首·其二
  lines:
    [
      昔日戏言身后事,
      今朝都到眼前来,
      衣裳已施行看尽,
      针线犹存未忍开,
      诚知此恨人人有,
      贫贱夫妻百事哀,
    ]
  tier: advanced

- author: 刘克庄
  title: 莺梭
  lines: [掷柳迁乔太有情, 交交时作弄机声, 洛阳三月花如锦, 多少工夫织得成]
  tier: advanced

- author: 刘克庄
  title: 贺新郎
  lines: [国脉微如缕, 未必人间无好汉, 自古一贤能制难]
  tier: advanced

- author: 刘方平
  title: 春怨
  lines: [纱窗日落渐黄昏, 金屋无人见泪痕, 寂寞空庭春欲晚, 梨花满地不开门]
  tier: advanced

- author: 刘方平
  title: 月夜
  lines: [更深月色半人家, 北斗阑干南斗斜, 今夜偏知春气暖, 虫声新透绿窗纱]
  tier: advanced

- author: 刘昚虚
  title: 阙题
  lines:
    [
      道由白云尽,
      春与青溪长,
      时有落花至,
      远随流水香,
      闲门向山路,
      深柳读书堂,
      幽映每白日,
      清辉照衣裳,
    ]
  tier: advanced

- author: 刘禹锡
  title: 乌衣巷
  lines: [朱雀桥边野草花, 乌衣巷口夕阳斜, 旧时王谢堂前燕, 飞入寻常百姓家]
  tier: advanced

- author: 刘禹锡
  title: 再游玄都观
  lines: [百亩庭中半是苔, 桃花净尽菜花开, 种桃道士归何处, 前度刘郎今又来]
  tier: advanced

- author: 刘禹锡
  title: 春词
  lines: [新妆宜面下朱楼, 深锁春光一院愁, 行到中庭数花朵, 蜻蜓飞上玉搔头]
  tier: advanced

- author: 刘禹锡
  title: 玄都观桃花
  lines: [紫陌红尘拂面来, 无人不道看花回, 玄都观里桃千树, 尽是刘郎去后栽]
  tier: advanced

- author: 刘禹锡
  title: 秋风引
  lines: [何处秋风至, 萧萧送雁群, 朝来入庭树, 孤客最先闻]
  tier: advanced

- author: 刘禹锡
  title: 竹枝词
  lines: [杨柳青青江水平, 闻郎江上唱歌声, 东边日出西边雨, 道是无晴却有晴]
  tier: advanced

- author: 刘禹锡
  title: 蜀先主庙
  lines:
    [
      天地英雄气,
      千秋尚凛然,
      势分三足鼎,
      业复五铢钱,
      得相能开国,
      生儿不象贤,
      凄凉蜀故妓,
      来舞魏宫前,
    ]
  tier: advanced

- author: 刘禹锡
  title: 西塞山怀古
  lines:
    [
      王濬楼船下益州,
      金陵王气黯然收,
      千寻铁锁沉江底,
      一片降幡出石头,
      人世几回伤往事,
      山形依旧枕寒流,
      今逢四海为家日,
      故垒萧萧芦荻秋,
    ]
  tier: advanced

- author: 刘翰
  title: 立秋
  lines: [乳鸦啼散玉屏空, 一枕新凉一扇风, 睡起秋声无觅处, 满阶梧叶月明中]
  tier: advanced

- author: 刘长卿
  title: 听弹琴
  lines: [泠泠七弦上, 静听松风寒, 古调虽自爱, 今人多不弹]
  tier: advanced

- author: 刘长卿
  title: 寻南溪常道士
  lines:
    [
      一路经行处,
      莓苔见履痕,
      白云依静渚,
      春草闭闲门,
      过雨看松色,
      随山到水源,
      溪花与禅意,
      相对亦忘言,
    ]
  tier: advanced

- author: 刘长卿
  title: 新年作
  lines:
    [
      乡心新岁切,
      天畔独潸然,
      老至居人下,
      春归在客先,
      岭猿同旦暮,
      江柳共风烟,
      已似长沙傅,
      从今又几年,
    ]
  tier: advanced

- author: 刘长卿
  title: 秋日登吴公台上寺远眺
  lines:
    [
      古台摇落后,
      秋日望乡心,
      野寺来人少,
      云峰隔水深,
      夕阳依旧垒,
      寒磬满空林,
      惆怅南朝事,
      长江独至今,
    ]
  tier: advanced

- author: 刘长卿
  title: 送上人
  lines: [孤云将野鹤, 岂向人间住, 莫买沃洲山, 时人已知处]
  tier: advanced

- author: 刘长卿
  title: 送李中丞归汉阳别业
  lines:
    [
      流落征南将,
      曾驱十万师,
      罢归无旧业,
      老去恋明时,
      独立三边静,
      轻生一剑知,
      茫茫江汉上,
      日暮欲何之,
    ]
  tier: advanced

- author: 刘长卿
  title: 送灵澈上人
  lines: [苍苍竹林寺, 杳杳钟声晚, 荷笠带斜阳, 青山独归远]
  tier: advanced

- author: 刘长卿
  title: 逢雪宿芙蓉山主人
  lines: [日暮苍山远, 天寒白屋贫, 柴门闻犬吠, 风雪夜归人]
  tier: advanced

- author: 刘长卿
  title: 长沙过贾谊宅
  anchor: 三年谪宦此栖迟
  lines: [秋草独寻人去后, 寒林空见日斜时]
  tier: advanced

- author: 刘长卿
  title: 饯别王十一南游
  lines:
    [
      望君烟水阔,
      挥手泪沾巾,
      飞鸟没何处,
      青山空向人,
      长江一帆远,
      落日五湖春,
      谁见汀洲上,
      相思愁白苹,
    ]
  tier: advanced

- author: 卢纶
  title: 塞下曲
  anchor: 林暗草惊风
  lines: [林暗草惊风, 将军夜引弓, 平明寻白羽, 没在石棱中]
  tier: advanced

- author: 卢纶
  title: 送李端
  lines:
    [
      故关衰草遍,
      离别自堪悲,
      路出寒云外,
      人归暮雪时,
      少孤为客早,
      多难识君迟,
      掩泪空相向,
      风尘何处期,
    ]
  tier: advanced

- author: 叶采
  title: 暮春即事
  lines: [双双瓦雀行书案, 点点杨花入砚池, 闲坐小窗读周易, 不知春去几多时]
  tier: advanced

- author: 司空曙
  title: 云阳馆与韩绅宿别
  lines:
    [
      故人江海别,
      几度隔山川,
      乍见翻疑梦,
      相悲各问年,
      孤灯寒照雨,
      深竹暗浮烟,
      更有明朝恨,
      离杯惜共传,
    ]
  tier: advanced

- author: 司空曙
  title: 喜外弟卢纶见宿
  lines:
    [
      静夜四无邻,
      荒居旧业贫,
      雨中黄叶树,
      灯下白头人,
      以我独沉久,
      愧君相见频,
      平生自有分,
      况是蔡家亲,
    ]
  tier: advanced

- author: 司空曙
  title: 贼平后送人北归
  lines:
    [
      世乱同南去,
      时清独北还,
      他乡生白发,
      旧国见青山,
      晓月过残垒,
      繁星宿故关,
      寒禽与衰草,
      处处伴愁颜,
    ]
  tier: advanced

- author: 司马光
  title: 客中初夏
  lines: [四月清和雨乍晴, 南山当户转分明, 更无柳絮因风起, 惟有葵花向日倾]
  tier: advanced

- author: 太上隐者
  title: 答人
  lines: [偶来松树下, 高枕石头眠, 山中无历日, 寒尽不知年]
  tier: advanced

- author: 姜夔
  title: 扬州慢·淮左名都
  lines: [过春风十里, 尽荠麦青青, 念桥边红药]
  tier: advanced

- author: 孟浩然
  title: 与诸子登岘山
  lines:
    [
      人事有代谢,
      往来成古今,
      江山留胜迹,
      我辈复登临,
      水落鱼梁浅,
      天寒梦泽深,
      羊公碑尚在,
      读罢泪沾襟,
    ]
  tier: advanced

- author: 孟浩然
  title: 夜归鹿门山歌
  lines:
    [
      山寺钟鸣昼已昏,
      渔梁渡头争渡喧,
      人随沙岸向江村,
      余亦乘舟归鹿门,
      鹿门月照开烟树,
      忽到庞公栖隐处,
      岩扉松径长寂寥,
      惟有幽人自来去,
    ]
  tier: advanced

- author: 孟浩然
  title: 宿建德江
  lines: [移舟泊烟渚, 日暮客愁新, 野旷天低树, 江清月近人]
  tier: advanced

- author: 孟浩然
  title: 宿桐庐江寄广陵旧游
  lines:
    [
      山暝闻猿愁,
      沧江急夜流,
      风鸣两岸叶,
      月照一孤舟,
      建德非吾土,
      维扬忆旧游,
      还将两行泪,
      遥寄海西头,
    ]
  tier: advanced

- author: 孟浩然
  title: 岁暮归南山
  lines:
    [
      北阙休上书,
      南山归敝庐,
      不才明主弃,
      多病故人疏,
      白发催年老,
      青阳逼岁除,
      永怀愁不寐,
      松月夜窗虚,
    ]
  tier: advanced

- author: 孟浩然
  title: 早寒有怀
  lines:
    [
      木落雁南度,
      北风江上寒,
      我家襄水曲,
      遥隔楚云端,
      乡泪客中尽,
      孤帆天际看,
      迷津欲有问,
      平海夕漫漫,
    ]
  tier: advanced

- author: 孟浩然
  title: 望洞庭湖赠张丞相
  lines: [八月湖水平, 涵虚混太清, 气蒸云梦泽, 波撼岳阳城]
  tier: advanced

- author: 孟浩然
  title: 留别王维
  lines:
    [
      寂寂竟何待,
      朝朝空自归,
      欲寻芳草去,
      惜与故人违,
      当路谁相假,
      知音世所稀,
      只应守寂寞,
      还掩故园扉,
    ]
  tier: advanced

- author: 孟浩然
  title: 秦中寄远上人
  lines:
    [
      一丘常欲卧,
      三径苦无资,
      北土非吾愿,
      东林怀我师,
      黄金燃桂尽,
      壮志逐年衰,
      日夕凉风至,
      闻蝉但益悲,
    ]
  tier: advanced

- author: 孟浩然
  title: 题义公禅房
  lines:
    [
      义公习禅寂,
      结宇依空林,
      户外一峰秀,
      阶前众壑深,
      夕阳连雨足,
      空翠落庭阴,
      看取莲花净,
      方知不染心,
    ]
  tier: advanced

- author: 宋之问
  title: 渡汉江
  lines: [岭外音书断, 经冬复历春, 近乡情更怯, 不敢问来人]
  tier: advanced

- author: 宋之问
  title: 题大庾岭北驿
  lines:
    [
      阳月南飞雁,
      传闻至此回,
      我行殊未已,
      何日复归来,
      江静潮初落,
      林昏瘴不开,
      明朝望乡处,
      应见陇头梅,
    ]
  tier: advanced

- author: 屈原
  title: 离骚
  lines: [帝高阳之苗裔兮, 皇览揆余初度兮, 日月忽其不淹兮, 惟草木之零落兮]
  tier: advanced

- author: 岑参
  title: 寄左省杜拾遗
  lines:
    [
      联步趋丹陛,
      分曹限紫微,
      晓随天仗入,
      暮惹御香归,
      白发悲花落,
      青云羡鸟飞,
      圣朝无阙事,
      自觉谏书稀,
    ]
  tier: advanced

- author: 岑参
  title: 行军九日思长安故园
  lines: [强欲登高去, 无人送酒来, 遥怜故园菊, 应傍战场开]
  tier: advanced

- author: 岑参
  title: 逢入京使
  lines: [故园东望路漫漫, 双袖龙钟泪不干, 马上相逢无纸笔, 凭君传语报平安]
  tier: advanced

- author: 岳飞
  title: 满江红
  lines: [三十功名尘与土, 八千里路云和月]
  tier: advanced

- author: 崔护
  title: 题都城南庄
  lines: [去年今日此门中, 人面桃花相映红, 人面不知何处在, 桃花依旧笑春风]
  tier: advanced

- author: 崔涂
  title: 孤雁
  lines:
    [
      几行归塞尽,
      念尔独何之,
      暮雨相呼失,
      寒塘欲下迟,
      渚云低暗度,
      关月冷相随,
      未必逢矰缴,
      孤飞自可疑,
    ]
  tier: advanced

- author: 崔涂
  title: 旅怀
  lines:
    [
      水流花谢两无情,
      送尽东风过楚城,
      蝴蝶梦中家万里,
      杜鹃枝上月三更,
      故园书动经年绝,
      华发春催两鬓生,
      自是不归归便得,
      五湖烟景有谁争,
    ]
  tier: advanced

- author: 崔涂
  title: 除夜有怀
  lines:
    [
      迢递三巴路,
      羁危万里身,
      乱山残雪夜,
      孤烛异乡人,
      渐与骨肉远,
      转于僮仆亲,
      那堪正飘泊,
      明日岁华新,
    ]
  tier: advanced

- author: 崔颢
  title: 长干行·君家何处住
  lines: [君家何处住, 妾住在横塘, 停船暂借问, 或恐是同乡]
  tier: advanced

- author: 崔颢
  title: 长干行·家临九江水
  lines: [家临九江水, 来去九江侧, 同是长干人, 生小不相识]
  tier: advanced

- author: 常建
  title: 宿王昌龄隐居
  lines:
    [
      清溪深不测,
      隐处唯孤云,
      松际露微月,
      清光犹为君,
      茅亭宿花影,
      药院滋苔纹,
      余亦谢时去,
      西山鸾鹤群,
    ]
  tier: advanced

- author: 张乔
  title: 书边事
  lines:
    [
      调角断清秋,
      征人倚戍楼,
      春风对青冢,
      白日落梁州,
      大汉无兵阻,
      穷边有客游,
      蕃情似此水,
      长愿向南流,
    ]
  tier: advanced

- author: 张九龄
  title: 感遇·兰叶春葳蕤
  lines: [兰叶春葳蕤, 桂华秋皎洁, 草木有本心, 何求美人折]
  tier: advanced

- author: 张九龄
  title: 望月怀远
  lines:
    [
      海上生明月,
      天涯共此时,
      情人怨遥夜,
      竟夕起相思,
      灭烛怜光满,
      披衣觉露滋,
      不堪盈手赠,
      还寝梦佳期,
    ]
  tier: advanced

- author: 张孝祥
  title: 念奴娇·过洞庭
  lines: [玉鉴琼田三万顷, 表里俱澄澈, 肝肺皆冰雪, 短发萧骚襟袖冷, 万象为宾客]
  tier: advanced

- author: 张旭
  title: 桃花溪
  lines: [隐隐飞桥隔野烟, 石矶西畔问渔船, 桃花尽日随流水, 洞在清溪何处边]
  tier: advanced

- author: 张栻
  title: 立春偶成
  lines: [律回岁晚冰霜少, 春到人间草木知, 便觉眼前生意满, 东风吹水绿参差]
  tier: advanced

- author: 张泌
  title: 寄人
  lines: [别梦依依到谢家, 小廊回合曲阑斜, 多情只有春庭月, 犹为离人照落花]
  tier: advanced

- author: 张祜
  title: 宫词
  lines: [故国三千里, 深宫二十年, 一声何满子, 双泪落君前]
  tier: advanced

- author: 张祜
  title: 赠内人
  lines: [禁门宫树月痕过, 媚眼惟看宿鹭窠, 斜拔玉钗灯影畔, 剔开红焰救飞蛾]
  tier: advanced

- author: 张祜
  title: 集灵台·其二
  lines: [虢国夫人承主恩, 平明骑马入宫门, 却嫌脂粉污颜色, 淡扫蛾眉朝至尊]
  tier: advanced

- author: 张祜
  title: 题金陵渡
  lines: [金陵津渡小山楼, 一宿行人自可愁, 潮落夜江斜月里, 两三星火是瓜州]
  tier: advanced

- author: 张籍
  title: 秋思
  lines: [洛阳城里见秋风, 欲作归书意万重, 忽恐匆匆说不尽, 行人临发又开封]
  tier: advanced

- author: 张说
  title: 蜀道后期
  lines: [客心争日月, 来往预期程, 秋风不相待, 先至洛阳城]
  tier: advanced

- author: 徐元杰
  title: 湖上
  lines: [花开红树乱莺啼, 草长平湖白鹭飞, 风日晴和人意好, 夕阳箫鼓几船归]
  tier: advanced

- author: 戴叔伦
  title: 江乡故人偶集客舍
  lines:
    [
      天秋月又满,
      城阙夜千重,
      还作江南会,
      翻疑梦里逢,
      风枝惊暗鹊,
      露草覆寒蛩,
      羁旅长堪醉,
      相留畏晓钟,
    ]
  tier: advanced

- author: 戴叔伦
  title: 过三闾庙
  lines: [沅湘流不尽, 屈子怨何深, 日暮秋风起, 萧萧枫树林]
  tier: advanced

- author: 戴复古
  title: 月夜舟中
  lines: [满船明月浸虚空, 绿水无痕夜气冲, 数点渔灯依古岸, 断桥垂露滴梧桐]
  tier: advanced

- author: 戴敏
  title: 夏日
  lines: [乳鸭池塘水浅深, 熟梅天气半晴阴, 东园载酒西园醉, 摘尽枇杷一树金]
  tier: advanced

- author: 晏几道
  title: 临江仙
  lines: [落花人独立, 微雨燕双飞]
  tier: advanced

- author: 晏殊
  title: 寓意
  lines: [梨花院落溶溶月, 柳絮池塘淡淡风]
  tier: advanced

- author: 晏殊
  title: 蝶恋花
  lines: [昨夜西风凋碧树]
  tier: advanced

- author: 曹豳
  title: 春暮
  lines: [门外无人问落花, 绿阴冉冉遍天涯, 林莺啼到无声处, 青草池塘独听蛙]
  tier: advanced

- author: 朱庆余
  title: 宫中词
  lines: [寂寂花时闭院门, 美人相并立琼轩, 含情欲说宫中事, 鹦鹉前头不敢言]
  tier: advanced

- author: 朱庆余
  title: 近试上张水部
  lines: [洞房昨夜停红烛, 待晓堂前拜舅姑, 妆罢低声问夫婿, 画眉深浅入时无]
  tier: advanced

- author: 朱放
  title: 题竹林寺
  lines: [岁月人间促, 烟霞此地多, 殷勤竹林寺, 更得几回过]
  tier: advanced

- author: 朱熹
  title: 观书有感
  anchor: 昨夜江边春水生
  lines: [昨夜江边春水生, 艨艟巨舰一毛轻, 向来枉费推移力, 此日中流自在行]
  tier: advanced

- author: 李之仪
  title: 卜算子
  lines: [我住长江头, 君住长江尾, 日日思君不见君, 共饮长江水]
  tier: advanced

- author: 李商隐
  title: 为有
  lines: [为有云屏无限娇, 凤城寒尽怕春宵, 无端嫁得金龟婿, 辜负香衾事早朝]
  tier: advanced

- author: 李商隐
  title: 乐游原
  lines: [向晚意不适, 驱车登古原, 夕阳无限好, 只是近黄昏]
  tier: advanced
  overrides:
    夕阳无限好: normal
    只是近黄昏: normal

- author: 李商隐
  title: 凉思
  lines:
    [
      客去波平槛,
      蝉休露满枝,
      永怀当此节,
      倚立自移时,
      北斗兼春远,
      南陵寓使迟,
      天涯占梦数,
      疑误有新知,
    ]
  tier: advanced

- author: 李商隐
  title: 北青萝
  lines:
    [
      残阳西入崦,
      茅屋访孤僧,
      落叶人何在,
      寒云路几层,
      独敲初夜磬,
      闲倚一枝藤,
      世界微尘里,
      吾宁爱与憎,
    ]
  tier: advanced

- author: 李商隐
  title: 嫦娥
  lines: [云母屏风烛影深, 长河渐落晓星沉, 嫦娥应悔偷灵药, 碧海青天夜夜心]
  tier: advanced

- author: 李商隐
  title: 寄令狐郎中
  lines: [嵩云秦树久离居, 双鲤迢迢一纸书, 休问梁园旧宾客, 茂陵秋雨病相如]
  tier: advanced

- author: 李商隐
  title: 无题
  anchor: 昨夜星辰昨夜风
  lines: [身无彩凤双飞翼, 心有灵犀一点通]
  tier: advanced

- author: 李商隐
  title: 无题·来是空言去绝踪
  lines: [刘郎已恨蓬山远, 更隔蓬山一万重]
  tier: advanced

- author: 李商隐
  title: 无题·重帏深下莫愁堂
  lines: [神女生涯原是梦, 小姑居处本无郎, 直道相思了无益, 未妨惆怅是清狂]
  tier: advanced

- author: 李商隐
  title: 无题·飒飒东风细雨来
  lines: [春心莫共花争发, 一寸相思一寸灰]
  tier: advanced

- author: 李商隐
  title: 春雨
  lines: [红楼隔雨相望冷, 珠箔飘灯独自归]
  tier: advanced

- author: 李商隐
  title: 瑶池
  lines: [瑶池阿母绮窗开, 黄竹歌声动地哀, 八骏日行三万里, 穆王何事不重来]
  tier: advanced

- author: 李商隐
  title: 落花
  lines:
    [
      高阁客竟去,
      小园花乱飞,
      参差连曲陌,
      迢递送斜晖,
      肠断未忍扫,
      眼穿仍欲归,
      芳心向春尽,
      所得是沾衣,
    ]
  tier: advanced

- author: 李商隐
  title: 蝉
  lines:
    [
      本以高难饱,
      徒劳恨费声,
      五更疏欲断,
      一树碧无情,
      薄宦梗犹泛,
      故园芜已平,
      烦君最相警,
      我亦举家清,
    ]
  tier: advanced

- author: 李商隐
  title: 贾生
  lines: [宣室求贤访逐臣, 贾生才调更无伦, 可怜夜半虚前席, 不问苍生问鬼神]
  tier: advanced

- author: 李商隐
  title: 隋宫
  anchor: 乘兴南游不戒严
  lines: [乘兴南游不戒严, 九重谁省谏书函, 春风举国裁宫锦, 半作障泥半作帆]
  tier: advanced

- author: 李商隐
  title: 隋宫
  anchor: 紫泉宫殿锁烟霞
  lines:
    [
      紫泉宫殿锁烟霞,
      欲取芜城作帝家,
      玉玺不缘归日角,
      锦帆应是到天涯,
      于今腐草无萤火,
      终古垂杨有暮鸦,
      地下若逢陈后主,
      岂宜重问后庭花,
    ]
  tier: advanced

- author: 李商隐
  title: 霜月
  lines: [初闻征雁已无蝉, 百尺楼台水接天, 青女素娥俱耐冷, 月中霜里斗婵娟]
  tier: advanced

- author: 李商隐
  title: 风雨
  lines:
    [
      凄凉宝剑篇,
      羁泊欲穷年,
      黄叶仍风雨,
      青楼自管弦,
      新知遭薄俗,
      旧好隔良缘,
      心断新丰酒,
      销愁斗几千,
    ]
  tier: advanced

- author: 李涉
  title: 登山
  lines: [终日昏昏醉梦间, 忽闻春尽强登山, 因过竹院逢僧话, 又得浮生半日闲]
  tier: advanced

- author: 李清照
  title: 一剪梅
  lines: [红藕香残玉簟秋, 花自飘零水自流, 此情无计可消除]
  tier: advanced
  overrides:
    此情无计可消除: normal

- author: 李白
  title: 与史朗中饮听黄鹤楼上吹笛
  lines: [一为迁客去长沙, 西望长安不见家, 黄鹤楼中吹玉笛, 江城五月落梅花]
  tier: advanced

- author: 李白
  title: 听蜀僧浚弹琴
  lines:
    [
      蜀僧抱绿绮,
      西下峨眉峰,
      为我一挥手,
      如听万壑松,
      客心洗流水,
      余响入霜钟,
      不觉碧山暮,
      秋云暗几重,
    ]
  tier: advanced

- author: 李白
  title: 塞下曲六首·其一
  lines:
    [
      五月天山雪,
      无花只有寒,
      笛中闻折柳,
      春色未曾看,
      晓战随金鼓,
      宵眠抱玉鞍,
      愿将腰下剑,
      直为斩楼兰,
    ]
  tier: advanced

- author: 李白
  title: 夜泊牛渚怀古
  lines:
    [
      牛渚西江夜,
      青天无片云,
      登舟望秋月,
      空忆谢将军,
      余亦能高咏,
      斯人不可闻,
      明朝挂帆席,
      枫叶落纷纷,
    ]
  tier: advanced

- author: 李白
  title: 子夜吴歌·冬歌
  lines:
    [明朝驿使发, 一夜絮征袍, 素手抽针冷, 那堪把剪刀, 裁缝寄远道, 几日到临洮]
  tier: advanced

- author: 李白
  title: 子夜吴歌·夏歌
  lines:
    [镜湖三百里, 菡萏发荷花, 五月西施采, 人看隘若耶, 回舟不待月, 归去越王家]
  tier: advanced

- author: 李白
  title: 子夜吴歌·春歌
  lines:
    [秦地罗敷女, 采桑绿水边, 素手青条上, 红妆白日鲜, 蚕饥妾欲去, 五马莫留连]
  tier: advanced

- author: 李白
  title: 子夜吴歌·秋歌
  lines:
    [长安一片月, 万户捣衣声, 秋风吹不尽, 总是玉关情, 何日平胡虏, 良人罢远征]
  tier: advanced

- author: 李白
  title: 客中行
  lines: [兰陵美酒郁金香, 玉碗盛来琥珀光, 但使主人能醉客, 不知何处是他乡]
  tier: advanced

- author: 李白
  title: 怨情
  lines: [美人卷珠帘, 深坐颦蛾眉, 但见泪痕湿, 不知心恨谁]
  tier: advanced

- author: 李白
  title: 春夜洛城闻笛
  lines: [谁家玉笛暗飞声, 散入春风满洛城, 此夜曲中闻折柳, 何人不起故园情]
  tier: advanced

- author: 李白
  title: 春思
  lines:
    [燕草如碧丝, 秦桑低绿枝, 当君怀归日, 是妾断肠时, 春风不相识, 何事入罗帏]
  tier: advanced

- author: 李白
  title: 清平调·一枝红艳露凝香
  lines: [一枝红艳露凝香, 云雨巫山枉断肠, 借问汉宫谁得似, 可怜飞燕倚新妆]
  tier: advanced

- author: 李白
  title: 清平调·云想衣裳花想容
  lines: [云想衣裳花想容, 春风拂槛露华浓, 若非群玉山头见, 会向瑶台月下逢]
  tier: advanced

- author: 李白
  title: 清平调·名花倾国两相欢
  lines: [名花倾国两相欢, 常得君王带笑看, 解释春风无限恨, 沉香亭北倚栏杆]
  tier: advanced

- author: 李白
  title: 独坐敬亭山
  lines: [众鸟高飞尽, 孤云独去闲, 相看两不厌, 只有敬亭山]
  tier: advanced

- author: 李白
  title: 玉阶怨
  lines: [玉阶生白露, 夜久侵罗袜, 却下水晶帘, 玲珑望秋月]
  tier: advanced

- author: 李白
  title: 登金陵凤凰台
  lines:
    [
      凤凰台上凤凰游,
      凤去台空江自流,
      吴宫花草埋幽径,
      晋代衣冠成古丘,
      三山半落青天外,
      二水中分白鹭洲,
      总为浮云能蔽日,
      长安不见使人愁,
    ]
  tier: advanced

- author: 李白
  title: 秋浦歌
  lines: [白发三千丈, 离愁似个长, 不知明镜里, 何处得秋霜]
  tier: advanced

- author: 李白
  title: 秋登宣城谢脁北楼
  lines: [江城如画里, 山晚望晴空]
  tier: advanced

- author: 李白
  title: 赠孟浩然
  lines:
    [
      吾爱孟夫子,
      风流天下闻,
      红颜弃轩冕,
      白首卧松云,
      醉月频中圣,
      迷花不事君,
      高山安可仰,
      徒此揖清芬,
    ]
  tier: advanced

- author: 李白
  title: 送友人
  lines:
    [
      青山横北郭,
      白水绕东城,
      此地一为别,
      孤篷万里征,
      浮云游子意,
      落日故人情,
      挥手自兹去,
      萧萧斑马鸣,
    ]
  tier: advanced

- author: 李白
  title: 送友人入蜀
  lines:
    [
      见说蚕丛路,
      崎岖不易行,
      山从人面起,
      云傍马头生,
      芳树笼秦栈,
      春流绕蜀城,
      升沈应已定,
      不必问君平,
    ]
  tier: advanced

- author: 李白
  title: 金陵酒肆留别
  lines:
    [
      风吹柳花满店香,
      吴姬压酒唤客尝,
      金陵子弟来相送,
      欲行不行各尽觞,
      请君试问东流水,
      别意与之谁短长,
    ]
  tier: advanced

- author: 李益
  title: 喜见外弟又言别
  lines:
    [
      十年离乱后,
      长大一相逢,
      问姓惊初见,
      称名忆旧容,
      别来沧海事,
      语罢暮天钟,
      明日巴陵道,
      秋山又几重,
    ]
  tier: advanced

- author: 李益
  title: 江南曲
  lines: [嫁得瞿塘贾, 朝朝误妾期, 早知潮有信, 嫁与弄潮儿]
  tier: advanced

- author: 李端
  title: 听筝
  lines: [鸣筝金粟柱, 素手玉房前, 欲得周郎顾, 时时误拂弦]
  tier: advanced

- author: 李贺
  title: 南园
  lines: [男儿何不带吴钩, 收取关山五十州, 请君暂上凌烟阁, 若个书生万户侯]
  tier: advanced

- author: 李颀
  title: 送魏万之京
  lines: [朝闻游子唱离歌, 昨夜微霜初渡河, 鸿雁不堪愁里听, 云山况是客中过]
  tier: advanced

- author: 杜审言
  title: 和晋陵陆丞早春游望
  lines:
    [
      独有宦游人,
      偏惊物候新,
      云霞出海曙,
      梅柳渡江春,
      淑气催黄鸟,
      晴光转绿苹,
      忽闻歌古调,
      归思欲沾巾,
    ]
  tier: advanced

- author: 杜小山
  title: 寒夜
  lines: [寒夜客来茶当酒, 竹炉汤沸火初红, 寻常一样窗前月, 才有梅花便不同]
  tier: advanced

- author: 杜牧
  title: 寄扬州韩绰判官
  lines: [青山隐隐水迢迢, 秋尽江南草未凋, 二十四桥明月夜, 玉人何处教吹箫]
  tier: advanced

- author: 杜牧
  title: 将赴吴兴登乐游原一绝
  lines: [清时有味是无能, 闲爱孤云静爱僧, 欲把一麾江海去, 乐游原上望昭陵]
  tier: advanced

- author: 杜牧
  title: 旅宿
  lines:
    [
      旅馆无良伴,
      凝情自悄然,
      寒灯思旧事,
      断雁警愁眠,
      远梦归侵晓,
      家书到隔年,
      沧江好烟月,
      门系钓鱼船,
    ]
  tier: advanced

- author: 杜牧
  title: 秋夕
  lines: [银烛秋光冷画屏, 轻罗小扇扑流萤, 天街夜色凉如水, 卧看牵牛织女星]
  tier: advanced

- author: 杜牧
  title: 赠别
  lines: [多情却似总无情, 唯觉樽前笑不成, 蜡烛有心还惜别, 替人垂泪到天明]
  tier: advanced

- author: 杜牧
  title: 赠别·其一
  lines: [娉娉袅袅十三余, 豆蔻梢头二月初, 春风十里扬州路, 卷上珠帘总不如]
  tier: advanced

- author: 杜牧
  title: 金谷园
  lines: [繁华事散逐香尘, 流水无情草自春, 日暮东风怨啼鸟, 落花犹似坠楼人]
  tier: advanced

- author: 杜甫
  title: 与朱山人
  lines:
    [
      锦里先生乌角巾,
      园收芋栗未全贫,
      惯看宾客儿童喜,
      得食阶除鸟雀驯,
      秋水才深四五尺,
      野航恰受两三人,
      白沙翠竹江村暮,
      相送柴门月色新,
    ]
  tier: advanced

- author: 杜甫
  title: 九日蓝耕会饮
  lines: [老去悲秋强自宽, 兴来今日尽君欢, 明年此会知谁健, 醉把茱萸仔细看]
  tier: advanced

- author: 杜甫
  title: 八阵图
  lines: [功盖三分国, 名成八阵图, 江流石不转, 遗恨失吞吴]
  tier: advanced

- author: 杜甫
  title: 冬至
  lines:
    [
      天时人事日相催,
      冬至阳生春又来,
      刺绣五纹添弱线,
      吹葭六管动飞灰,
      岸容待腊将舒柳,
      山意冲寒欲放梅,
      云物不殊乡国异,
      教儿且覆掌中杯,
    ]
  tier: advanced

- author: 杜甫
  title: 别房太尉墓
  lines:
    [
      他乡复行役,
      驻马别孤坟,
      近泪无干土,
      低空有断云,
      对棋陪谢傅,
      把剑觅徐君,
      唯见林花落,
      莺啼送客闻,
    ]
  tier: advanced

- author: 杜甫
  title: 咏怀古迹·其一
  lines: [支离东北风尘际, 漂泊西南天地间, 三峡楼台淹日月, 五溪衣服共云山]
  tier: advanced

- author: 杜甫
  title: 咏怀古迹·其三
  lines: [群山万壑赴荆门, 生长明妃尚有村, 一去紫台连朔漠, 独留青冢向黄昏]
  tier: advanced

- author: 杜甫
  title: 咏怀古迹·其二
  lines: [摇落深知宋玉悲, 风流儒雅亦吾师, 怅望千秋一洒泪, 萧条异代不同时]
  tier: advanced

- author: 杜甫
  title: 咏怀古迹·其五
  lines: [诸葛大名垂宇宙, 宗臣遗像肃清高, 三分割据纡筹策, 万古云霄一羽毛]
  tier: advanced

- author: 杜甫
  title: 天末怀李白
  lines:
    [
      凉风起天末,
      君子意如何,
      鸿雁几时到,
      江湖秋水多,
      文章憎命达,
      魑魅喜人过,
      应共冤魂语,
      投诗赠汨罗,
    ]
  tier: advanced

- author: 杜甫
  title: 奉济驿重送严公四韵
  lines:
    [
      远送从此别,
      青山空复情,
      几时杯重把,
      昨夜月同行,
      列郡讴歌惜,
      三朝出入荣,
      江村独归处,
      寂寞养残生,
    ]
  tier: advanced

- author: 杜甫
  title: 宿府
  lines:
    [
      清秋幕府井梧寒,
      独宿江城蜡炬残,
      永夜角声悲自语,
      中天月色好谁看,
      风尘荏苒音书绝,
      关塞萧条行路难,
      已忍伶俜十年事,
      强移栖息一枝安,
    ]
  tier: advanced

- author: 杜甫
  title: 春宿左省
  lines:
    [
      花隐掖垣暮,
      啾啾栖鸟过,
      星临万户动,
      月傍九霄多,
      不寝听金钥,
      因风想玉珂,
      明朝有封事,
      数问夜如何,
    ]
  tier: advanced

- author: 杜甫
  title: 月夜
  lines:
    [
      今夜鄜州月,
      闺中只独看,
      遥怜小儿女,
      未解忆长安,
      香雾云鬟湿,
      清辉玉臂寒,
      何时倚虚幌,
      双照泪痕干,
    ]
  tier: advanced

- author: 杜甫
  title: 江南逢李龟年
  lines: [岐王宅里寻常见, 崔九堂前几度闻, 正是江南好风景, 落花时节又逢君]
  tier: advanced

- author: 杜甫
  title: 江村
  lines:
    [
      清江一曲抱村流,
      长夏江村事事幽,
      自去自来梁上燕,
      相亲相近水中鸥,
      老妻画纸为棋局,
      稚子敲针作钓钩,
      多病所须惟药物,
      微躯此外更何求,
    ]
  tier: advanced

- author: 杜甫
  title: 江畔独步寻花
  anchor: 黄四娘家花满蹊
  lines: [黄四娘家花满蹊, 千朵万朵压枝低, 留连戏蝶时时舞, 自在娇莺恰恰啼]
  tier: advanced

- author: 杜甫
  title: 登楼
  lines:
    [
      花近高楼伤客心,
      万方多难此登临,
      锦江春色来天地,
      玉垒浮云变古今,
      北极朝廷终不改,
      西山寇盗莫相侵,
      可怜后主还祠庙,
      日暮聊为梁甫吟,
    ]
  tier: advanced

- author: 杜甫
  title: 绝句
  anchor: 江碧鸟逾白
  lines: [江碧鸟逾白, 山青花欲燃]
  tier: advanced

- author: 杜甫
  title: 绝句漫兴
  lines: [肠断春江欲尽头, 杖藜徐步立芳洲, 颠狂柳絮随风舞, 轻薄桃花逐水流]
  tier: advanced

- author: 杜甫
  title: 赠卫八处士
  lines: [人生不相见, 动如参与商, 今夕复何夕, 共此灯烛光]
  tier: advanced

- author: 杜甫
  title: 赠花卿
  lines: [锦城丝管日纷纷, 半入江风半入云, 此曲秪应天上有, 人间能得几回闻]
  tier: advanced

- author: 杜甫
  title: 野望
  lines:
    [
      西山白雪三城戍,
      南浦清江万里桥,
      海内风尘诸弟隔,
      天涯涕泪一身遥,
      惟将迟暮供多病,
      未有涓埃答圣朝,
      跨马出郊时极目,
      不堪人事日萧条,
    ]
  tier: advanced

- author: 杜甫
  title: 阁夜
  lines: [五更鼓角声悲壮, 三峡星河影动摇, 卧龙跃马终黄土, 人事依依漫寂寥]
  tier: advanced

- author: 杜荀鹤
  title: 山中寡妇
  lines:
    [
      夫因兵乱守蓬茅,
      麻苎裙衫鬓发焦,
      桑柘废来犹纳税,
      田园荒尽尚征苗,
      时挑野菜和根煮,
      旋砍生柴带叶烧,
      任是深山最深处,
      也应无计避征徭,
    ]
  tier: advanced

- author: 杜荀鹤
  title: 春宫怨
  lines:
    [
      早被婵娟误,
      欲妆临镜慵,
      承恩不在貌,
      教妾若为容,
      风暖鸟声碎,
      日高花影重,
      年年越溪女,
      相忆采芙蓉,
    ]
  tier: advanced

- author: 杨万里
  title: 伤春
  lines: [准拟今春乐事浓, 依然枉却一东风, 年年不带看花眼, 不是愁中即病中]
  tier: advanced

- author: 杨万里
  title: 初夏睡起
  lines: [梅子流酸溅齿牙, 芭蕉分绿上窗纱, 日长睡起无情思, 闲看儿童捉柳花]
  tier: advanced

- author: 杨万里
  title: 过松源晨炊漆公店
  lines: [莫言下岭便无难, 赚得行人错喜懽, 政入万山围子里, 一山放出一山拦]
  tier: advanced

- author: 杨巨源
  title: 城东早春
  lines: [诗家清景在新春, 绿柳才黄半未匀, 若待上林花似锦, 出门俱是看花人]
  tier: advanced

- author: 杨朴
  title: 七夕
  lines: [未会牵牛意若何, 须邀织女弄金梭, 年年乞与人间巧, 不道人间巧已多]
  tier: advanced

- author: 林稹
  title: 冷泉亭
  lines: [一泓清可沁诗脾, 冷暖年来只自知, 流出西湖载歌舞, 回头不似在山时]
  tier: advanced

- author: 林逋
  title: 山园小梅
  anchor: 众芳摇落独暄妍
  lines: [疏影横斜水清浅, 暗香浮动月黄昏]
  tier: advanced

- author: 柳中庸
  title: 征人怨
  lines: [岁岁金河复玉关, 朝朝马策与刀环, 三春白雪归青冢, 万里黄河绕黑山]
  tier: advanced

- author: 柳宗元
  title: 柳州二月榕叶落尽偶题
  lines: [宦情羁思共凄凄, 春半如秋意转迷]
  tier: advanced

- author: 柳宗元
  title: 渔翁
  lines:
    [
      渔翁夜傍西岩宿,
      晓汲清湘燃楚竹,
      烟销日出不见人,
      欸乃一声山水绿,
      回看天际下中流,
      岩上无心云相逐,
    ]
  tier: advanced

- author: 柳宗元
  title: 溪居
  lines:
    [
      久为簪组累,
      幸此南夷谪,
      闲依农圃邻,
      偶似山林客,
      晓耕翻露草,
      夜榜响溪石,
      来往不逢人,
      长歌楚天碧,
    ]
  tier: advanced

- author: 柳宗元
  title: 登柳州城楼寄漳汀封连四州
  lines: [城上高楼接大荒, 海天愁思正茫茫, 岭树重遮千里目, 江流曲似九回肠]
  tier: advanced

- author: 欧阳修
  title: 答丁元珍
  lines:
    [
      春风疑不到天涯,
      二月山城未见花,
      残雪压枝犹有橘,
      冻雷惊笋欲抽芽,
      夜闻啼雁生乡思,
      病入新年感物华,
      曾是洛阳花下客,
      野芳虽晚不须嗟,
    ]
  tier: advanced

- author: 沈佺期
  title: 杂诗三首·其三
  lines:
    [
      闻道黄龙戍,
      频年不解兵,
      可怜闺里月,
      长在汉家营,
      少妇今春意,
      良人昨夜情,
      谁能将旗鼓,
      一为取龙城,
    ]
  tier: advanced

- author: 温庭筠
  title: 瑶瑟怨
  lines: [冰簟银床梦不成, 碧天如水夜云轻, 雁声远过潇湘去, 十二楼中月自明]
  tier: advanced

- author: 温庭筠
  title: 送人东游
  lines:
    [
      荒戍落黄叶,
      浩然离故关,
      高风汉阳渡,
      初日郢门山,
      江上几人在,
      天涯孤棹还,
      何当重相见,
      樽酒慰离颜,
    ]
  tier: advanced

- author: 王令
  title: 送春
  lines: [三月残花落更开, 小檐日日燕飞来, 子规夜半犹啼血, 不信东风唤不回]
  tier: advanced

- author: 王安石
  title: 北山
  lines: [北山输绿涨横陂, 直堑回塘滟滟时, 细数落花因坐久, 缓寻芳草得归迟]
  tier: advanced

- author: 王安石
  title: 春夜
  lines: [金炉香烬漏声残, 剪剪轻风阵阵寒, 春色恼人眠不得, 月移花影上栏杆]
  tier: advanced

- author: 王建
  title: 新嫁娘词
  lines: [三日入厨下, 洗手作羹汤, 未谙姑食性, 先遣小姑尝]
  tier: advanced

- author: 王昌龄
  title: 从军行
  lines: [青海长云暗雪山, 孤城遥望雁门关, 黄沙百战穿金甲, 不破楼兰终不还]
  tier: advanced

- author: 王昌龄
  title: 塞下曲
  lines: [饮马渡秋水, 水寒风似刀]
  tier: advanced

- author: 王昌龄
  title: 春宫曲
  lines: [昨夜风开露井桃, 未央前殿月轮高, 平阳歌舞新承宠, 帘外春寒赐锦袍]
  tier: advanced

- author: 王昌龄
  title: 闺怨
  lines: [闺中少妇不知愁, 春日凝妆上翠楼, 忽见陌头杨柳色, 悔教夫婿觅封侯]
  tier: advanced

- author: 王淇
  title: 梅
  lines: [不受尘埃半点侵, 竹篱茅舍自甘心, 只因误识林和靖, 惹得诗人说到今]
  tier: advanced

- author: 王禹偁
  title: 清明
  lines: [无花无酒过清明, 兴味萧然似野僧, 昨日邻家乞新火, 晓窗分与读书灯]
  tier: advanced

- author: 王绩
  title: 野望
  lines:
    [
      东皋薄暮望,
      徙倚欲何依,
      树树皆秋色,
      山山惟落晖,
      牧人驱犊返,
      猎马带禽归,
      相顾无相识,
      长歌怀采薇,
    ]
  tier: advanced

- author: 王维
  title: 奉和圣制从蓬莱向兴庆阁道
  lines: [云里帝城双凤阙, 雨中春树万人家]
  tier: advanced

- author: 王维
  title: 少年行
  lines: [新丰美酒斗十千, 咸阳游侠多少年, 相逢意气为君饮, 系马高楼垂柳边]
  tier: advanced

- author: 王维
  title: 山中送别
  lines: [山中相送罢, 日暮掩柴扉, 春草明年绿, 王孙归不归]
  tier: advanced

- author: 王维
  title: 归嵩山作
  lines:
    [
      清川带长薄,
      车马去闲闲,
      流水如有意,
      暮禽相与还,
      荒城临古渡,
      落日满秋山,
      迢递嵩高下,
      归来且闭关,
    ]
  tier: advanced

- author: 王维
  title: 汉江临泛
  anchor: 楚塞三湘接
  lines: [江流天地外, 山色有无中]
  tier: advanced

- author: 王维
  title: 秋夜曲
  lines: [桂魄初生秋露微, 轻罗已薄未更衣, 银筝夜久殷勤弄, 心怯空房不忍归]
  tier: advanced

- author: 王维
  title: 积雨辋川庄作
  lines: [漠漠水田飞白鹭, 阴阴夏木啭黄鹂]
  tier: advanced

- author: 王维
  title: 终南山
  lines:
    [
      太乙近天都,
      连山接海隅,
      白云回望合,
      青霭入看无,
      分野中峰变,
      阴晴众壑殊,
      欲投人处宿,
      隔水问樵夫,
    ]
  tier: advanced

- author: 王维
  title: 辋川闲居赠裴秀才迪
  lines:
    [
      寒山转苍翠,
      秋水日潺湲,
      倚杖柴门外,
      临风听暮蝉,
      渡头余落日,
      墟里上孤烟,
      复值接舆醉,
      狂歌五柳前,
    ]
  tier: advanced

- author: 王维
  title: 过香积寺
  lines:
    [
      不知香积寺,
      数里入云峰,
      古木无人径,
      深山何处钟,
      泉声咽危石,
      日色冷青松,
      薄暮空潭曲,
      安禅制毒龙,
    ]
  tier: advanced

- author: 王维
  title: 送别
  lines:
    [下马饮君酒, 问君何所之, 君言不得意, 归卧南山陲, 但去莫复问, 白云无尽时]
  tier: advanced

- author: 王维
  title: 送梓州李使君
  lines: [万壑树参天, 千山响杜鹃, 山中一夜雨, 树杪百重泉]
  tier: advanced

- author: 王维
  title: 酬张少府
  lines:
    [
      晚年唯好静,
      万事不关心,
      自顾无长策,
      空知返旧林,
      松风吹解带,
      山月照弹琴,
      君问穷通理,
      渔歌入浦深,
    ]
  tier: advanced

- author: 王维
  title: 鸟鸣涧
  lines: [人闲桂花落, 夜静春山空, 月出惊山鸟, 时鸣春涧中]
  tier: advanced

- author: 王驾
  title: 雨晴
  lines: [雨前初见花间蕊, 雨后全无叶底花, 蜂蝶纷纷过墙去, 却疑春色在邻家]
  tier: advanced

- author: 白居易
  title: 后宫词
  lines: [泪湿罗巾梦不成, 夜深前殿按歌声, 红颜未老恩先断, 斜倚薰笼坐到明]
  tier: advanced

- author: 白居易
  title: 大林寺桃花
  lines: [人间四月芳菲尽, 山寺桃花始盛开, 长恨春归无觅处, 不知转入此中来]
  tier: advanced

- author: 白居易
  title: 暮江吟
  lines: [一道残阳铺水中, 半江瑟瑟半江红, 可怜九月初三夜, 露似真珠月似弓]
  tier: advanced

- author: 白居易
  title: 望月有感
  lines:
    [
      时难年荒世业空,
      弟兄羁旅各西东,
      田园寥落干戈后,
      骨肉流离道路中,
      吊影分为千里雁,
      辞根散作九秋蓬,
      共看明月应垂泪,
      一夜乡心五处同,
    ]
  tier: advanced

- author: 白居易
  title: 白云泉
  lines: [天平山上白云泉, 云自无心水自闲, 何必奔冲山下去, 更添波浪向人间]
  tier: advanced

- author: 白居易
  title: 直中书省
  lines: [丝纶阁下文章静, 钟鼓楼中刻漏长, 独坐黄昏谁是伴, 紫薇花对紫薇郎]
  tier: advanced

- author: 白居易
  title: 长恨歌
  anchor: 在天愿作比翼鸟
  lines:
    [
      回眸一笑百媚生,
      六宫粉黛无颜色,
      在天愿作比翼鸟,
      在地愿为连理枝,
      天长地久有时尽,
      此恨绵绵无绝期,
    ]
  tier: advanced

- author: 白居易
  title: 问刘十九
  lines: [绿蚁新醅酒, 红泥小火炉, 晚来天欲雪, 能饮一杯无]
  tier: advanced

- author: 白玉蟾
  title: 早春
  lines: [南枝才放两三花, 雪里吟香弄粉些, 淡淡著烟浓著月, 深深笼水浅笼沙]
  tier: advanced

- author: 皇甫冉
  title: 春思
  lines:
    [
      莺啼燕语报新年,
      马邑龙堆路几千,
      家住层城临汉苑,
      心随明月到胡天,
      机中锦字论长恨,
      楼上花枝笑独眠,
      为问元戎窦车骑,
      何时返旆勒燕然,
    ]
  tier: advanced

- author: 皎然
  title: 寻陆鸿渐不遇
  lines:
    [
      移家虽带郭,
      野径入桑麻,
      近种篱边菊,
      秋来未著花,
      扣门无犬吠,
      欲去问西家,
      报道山中去,
      归时每日斜,
    ]
  tier: advanced

- author: 祖咏
  title: 江南旅情
  lines:
    [
      楚山不可极,
      归路但萧条,
      海色晴看雨,
      江声夜听潮,
      剑留南斗近,
      书寄北风遥,
      为报空潭橘,
      无媒寄洛桥,
    ]
  tier: advanced

- author: 祖咏
  title: 终南望余雪
  lines: [终南阴岭秀, 积雪浮云端, 林表明霁色, 城中增暮寒]
  tier: advanced

- author: 秦韬玉
  title: 贫女
  lines: [苦恨年年压金线, 为他人作嫁衣裳]
  tier: advanced

- author: 程颢
  title: 春日偶成
  lines: [云淡风轻近午天, 傍花随柳过前川, 时人不识余心乐, 将谓偷闲学少年]
  tier: advanced

- author: 程颢
  title: 游月陂
  lines:
    [
      月坡堤上四徘徊,
      北有中天百尺台,
      万物已随秋气改,
      一樽聊为晚凉开,
      水心云影闲相照,
      林下泉声静自来,
      世事无端何足计,
      但逢佳节约重陪,
    ]
  tier: advanced

- author: 程颢
  title: 秋月
  lines: [清溪流过碧山头, 空水澄鲜一色秋, 隔断红尘三十里, 白云红叶两悠悠]
  tier: advanced

- author: 程颢
  title: 郊行即事
  lines:
    [
      芳原绿野恣行时,
      春入遥山碧四围,
      兴逐乱红穿柳巷,
      困临流水坐苔矶,
      莫辞盏酒十分劝,
      只恐风花一片飞,
      况是清明好天气,
      不妨游衍莫忘归,
    ]
  tier: advanced

- author: 程颢
  title: 题淮南寺
  lines: [南去北来休便休, 白苹吹尽楚江秋, 道人不是悲秋客, 一任晚山相对愁]
  tier: advanced

- author: 窦叔向
  title: 表兄话旧
  lines:
    [
      夜合花开香满庭,
      夜深微雨醉初醒,
      远书珍重何由达,
      旧事凄凉不可听,
      去日儿童皆长大,
      昔年亲友半凋零,
      明朝又是孤舟别,
      愁见河桥酒幔青,
    ]
  tier: advanced

- author: 苏轼
  title: 定风波
  lines: [莫听穿林打叶声, 何妨吟啸且徐行, 竹杖芒鞋轻胜马]
  tier: advanced

- author: 苏轼
  title: 浣溪沙
  lines: [谁道人生无再少, 门前流水尚能西, 休将白发唱黄鸡]
  tier: advanced

- author: 苏轼
  title: 海棠
  lines: [东风袅袅泛崇光, 香雾空蒙月转廊, 只恐夜深花睡去, 故烧高烛照红妆]
  tier: advanced

- author: 苏轼
  title: 花影
  lines: [重重叠叠上瑶台, 几度呼童扫不开, 刚被太阳收拾去, 却教明月送将来]
  tier: advanced

- author: 苏轼
  title: 赠刘景文
  lines: [荷尽已无擎雨盖, 菊残犹有傲霜枝, 一年好景君须记, 最是橙黄橘绿时]
  tier: advanced

- author: 苏颋
  title: 汾上惊秋
  lines: [北风吹白云, 万里渡河汾, 心绪逢摇落, 秋声不可闻]
  tier: advanced

- author: 蔡确
  title: 夏日登车盖亭
  lines: [纸屏石枕竹方床, 手倦抛书午梦长, 睡起莞然成独笑, 数声渔笛在沧浪]
  tier: advanced

- author: 裴迪
  title: 送崔九
  lines: [归山深浅去, 须尽丘壑美, 莫学武陵人, 暂游桃源里]
  tier: advanced

- author: 西鄙人
  title: 哥舒歌
  lines: [北斗七星高, 哥舒夜带刀, 至今窥牧马, 不敢过临洮]
  tier: advanced

- author: 许浑
  title: 早秋
  lines:
    [
      遥夜泛清瑟,
      西风生翠萝,
      残萤委玉露,
      早雁拂金河,
      高树晓还密,
      远山晴更多,
      淮南一叶下,
      自觉洞庭波,
    ]
  tier: advanced

- author: 许浑
  title: 秋日赴阙题潼关驿楼
  lines:
    [
      红叶晚萧萧,
      长亭酒一瓢,
      残云归太华,
      疏雨过中条,
      树色随山迥,
      河声入海遥,
      帝乡明日到,
      犹自梦渔樵,
    ]
  tier: advanced

- author: 谢枋得
  title: 庆全庵桃花
  lines: [寻得桃源好避秦, 桃红又是一年春, 花飞莫遣随流水, 怕有渔郎来问津]
  tier: advanced

- author: 谢枋得
  title: 蚕妇吟
  lines: [子规啼彻四更时, 起视蚕稠怕叶稀, 不信楼头杨柳月, 玉人歌舞未曾归]
  tier: advanced

- author: 贾岛
  title: 三月晦日送春
  lines: [三月正当三十日, 风光别我苦吟身, 共君今夜不须睡, 未到晓钟犹是春]
  tier: advanced

- author: 赵嘏
  title: 江楼有感
  lines: [独上江楼思渺然, 月光如水水如天, 同来玩月人何在, 风景依稀似去年]
  tier: advanced

- author: 赵嘏
  title: 长安秋望
  lines: [残星几点雁横塞, 长笛一声人倚楼]
  tier: advanced

- author: 辛弃疾
  title: 丑奴儿·书博山道中壁
  lines: [少年不识愁滋味, 而今识尽愁滋味, 却道天凉好个秋]
  tier: advanced

- author: 郑畋
  title: 马嵬坡
  lines: [玄宗回马杨妃死, 云雨虽亡日月新, 终是圣明天子事, 景阳宫井又何人]
  tier: advanced

- author: 金昌绪
  title: 春怨
  lines: [打起黄莺儿, 莫教枝上啼, 啼时惊妾梦, 不得到辽西]
  tier: advanced

- author: 钱起
  title: 归雁
  lines: [潇湘何事等闲回, 水碧沙明两岸苔, 二十五弦弹夜月, 不胜清怨却飞来]
  tier: advanced

- author: 钱起
  title: 谷口书斋寄杨补阙
  lines:
    [
      泉壑带茅茨,
      云霞生薜帷,
      竹怜新雨后,
      山爱夕阳时,
      闲鹭栖常早,
      秋花落更迟,
      家僮扫萝径,
      昨与故人期,
    ]
  tier: advanced

- author: 钱起
  title: 送僧归日本
  lines:
    [
      上国随缘住,
      来途若梦行,
      浮天沧海远,
      去世法舟轻,
      水月通禅寂,
      鱼龙听梵声,
      惟怜一灯影,
      万里眼中明,
    ]
  tier: advanced

- author: 钱起
  title: 逢侠者
  lines: [燕赵悲歌士, 相逢剧孟家, 寸心言不尽, 前路日将斜]
  tier: advanced

- author: 陆游
  title: 冬夜读书示子聿
  lines: [古人学问无遗力, 少壮工夫老始成, 纸上得来终觉浅, 绝知此事要躬行]
  tier: advanced
  overrides:
    纸上得来终觉浅: normal
    绝知此事要躬行: normal

- author: 陆游
  title: 十一月四日风雨大作
  lines: [僵卧孤村不自哀, 尚思为国戍轮台, 夜阑卧聴风吹雨, 铁马冰河入梦来]
  tier: advanced

- author: 陆游
  title: 新竹
  lines:
    [
      插棘编篱谨护持,
      养成寒碧映涟漪,
      清风掠地秋先到,
      赤日行天午不知,
      解箨时闻声簌簌,
      放梢初见影离离,
      归闲我欲频来此,
      枕簟仍教到处随,
    ]
  tier: advanced

- author: 陆游
  title: 秋思
  lines:
    [
      利欲驱人万火牛,
      江湖浪迹一沙鸥,
      日长似岁闲方觉,
      事大如天醉亦休,
      砧杵敲残深巷月,
      梧桐摇落故园秋,
      欲舒老眼无高处,
      安得元龙百尺楼,
    ]
  tier: advanced

- author: 陈子昂
  title: 春夜别友人
  lines:
    [
      银烛吐青烟,
      金尊对绮筵,
      离堂思琴瑟,
      别路绕山川,
      明月悬高树,
      长河没晓天,
      悠悠洛阳道,
      此会在何年,
    ]
  tier: advanced

- author: 陈陶
  title: 陇西行
  lines: [誓扫匈奴不顾身, 五千貂锦丧胡尘, 可怜无定河边骨, 犹是春闺梦里人]
  tier: advanced

- author: 雷震
  title: 村晚
  lines: [草满池塘水满陂, 山衔落日浸寒漪, 牧童归去横牛背, 短笛无腔信口吹]
  tier: advanced

- author: 韦庄
  title: 章台夜思
  lines:
    [
      清瑟怨遥夜,
      绕弦风雨哀,
      孤灯闻楚角,
      残月下章台,
      芳草已云暮,
      故人殊未来,
      乡书不可寄,
      秋雁又南回,
    ]
  tier: advanced

- author: 韦庄
  title: 金陵图
  lines: [谁谓伤心画不成, 画人心逐世人情, 君看六幅南朝事, 老木寒云满故城]
  tier: advanced

- author: 韦应物
  title: 寄全椒山中道士
  lines:
    [
      今朝郡斋冷,
      忽念山中客,
      涧底束荆薪,
      归来煮白石,
      欲持一瓢酒,
      远慰风雨夕,
      落叶满空山,
      何处寻行迹,
    ]
  tier: advanced

- author: 韦应物
  title: 寄李儋元锡
  lines:
    [
      去年花里逢君别,
      今日花开又一年,
      世事茫茫难自料,
      春愁黯黯独成眠,
      身多疾病思田里,
      邑有流亡愧俸钱,
      闻道欲来相问讯,
      西楼望月几回圆,
    ]
  tier: advanced

- author: 韦应物
  title: 淮上喜会梁州故人
  lines:
    [
      江汉曾为客,
      相逢每醉还,
      浮云一别后,
      流水十年间,
      欢笑情如旧,
      萧疏鬓已斑,
      何因不归去,
      淮上有秋山,
    ]
  tier: advanced

- author: 韦应物
  title: 秋夜寄邱员外
  lines: [怀君属秋夜, 散步咏凉天, 空山松子落, 幽人应未眠]
  tier: advanced

- author: 韦应物
  title: 赋得暮雨送李曹
  lines:
    [
      楚江微雨里,
      建业暮钟时,
      漠漠帆来重,
      冥冥鸟去迟,
      海门深不见,
      浦树远含滋,
      相送情无限,
      沾襟比散丝,
    ]
  tier: advanced

- author: 韩偓
  title: 已凉
  lines: [碧阑干外绣帘垂, 猩血屏风画折枝, 八尺龙须方锦褥, 已凉天气未寒时]
  tier: advanced

- author: 韩愈
  title: 左迁至蓝关示侄孙湘
  lines: [云横秦岭家何在, 雪拥蓝关马不前]
  tier: advanced

- author: 韩愈
  title: 晚春
  lines: [草树知春不久归, 百般红紫鬬芳菲, 杨花榆荚无才思, 惟解漫天作雪飞]
  tier: advanced

- author: 韩翃
  title: 寒食
  lines: [春城无处不飞花, 寒食东风御柳斜, 日暮汉宫传蜡烛, 轻烟散入五侯家]
  tier: advanced

- author: 韩翃
  title: 酬程延秋夜即事见赠
  lines:
    [
      长簟迎风早,
      空城澹月华,
      星河秋一雁,
      砧杵夜千家,
      节候看应晚,
      心期卧亦赊,
      向来吟秀句,
      不觉已鸣鸦,
    ]
  tier: advanced

- author: 马戴
  title: 楚江怀古三首·其一
  lines:
    [
      露气寒光集,
      微阳下楚丘,
      猿啼洞庭树,
      人在木兰舟,
      广泽生明月,
      苍山夹乱流,
      云中君不见,
      竟夕自悲秋,
    ]
  tier: advanced

- author: 马戴
  title: 灞上秋居
  lines:
    [
      灞原风雨定,
      晚见雁行频,
      落叶他乡树,
      寒灯独夜人,
      空园白露滴,
      孤壁野僧邻,
      寄卧郊扉久,
      何年致此身,
    ]
  tier: advanced

- author: 骆宾王
  title: 在狱咏蝉
  lines:
    [
      西陆蝉声唱,
      南冠客思深,
      不堪玄鬓影,
      来对白头吟,
      露重飞难进,
      风多响易沉,
      无人信高洁,
      谁为表予心,
    ]
  tier: advanced

- author: 骆宾王
  title: 易水送别
  lines: [此地别燕丹, 壮士发冲冠, 昔时人已没, 今日水犹寒]
  tier: advanced

- author: 高蟾
  title: 上高侍郎
  lines: [天上碧桃和露种, 日边红杏倚云栽, 芙蓉生在秋江上, 不向东风怨未开]
  tier: advanced

- author: 高适
  title: 咏史
  lines: [尚有绨袍赠, 应怜范叔寒, 不知天下士, 犹作布衣看]
  tier: advanced

- author: 高适
  title: 醉后赠张九旭
  lines:
    [
      世上漫相识,
      此翁殊不然,
      兴来书自圣,
      醉后语尤颠,
      白发老闲事,
      青云在目前,
      床头一壶酒,
      能更几回眠,
    ]
  tier: advanced

- author: 高骈
  title: 山居夏日
  lines: [绿树阴浓夏日长, 楼台倒影入池塘, 水晶帘动微风起, 满架蔷薇一院香]
  tier: advanced

- author: 黄庭坚
  title: 清明
  lines: [佳节清明桃李笑, 野田荒冢只生愁, 雷惊天地龙蛇蛰, 雨足郊原草木柔]
  tier: advanced
